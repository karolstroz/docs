<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BZZZball — Retro Pinball</title>
<style>
  :root{
    --bg-deep:#060410;
    --bg-glow:#17102B;
    --ink:#EDE9FF;
    --cyan:#28F2E4;
    --magenta:#FF3EA5;
    --amber:#FFC93C;
    --violet:#7B5CFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, var(--bg-glow) 0%, var(--bg-deep) 70%);
    color:var(--ink);
    font-family:"Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  h1{
    font-size:clamp(18px,3.4vw,30px);
    font-weight:700;letter-spacing:.45em;text-transform:uppercase;
    text-shadow:0 0 6px var(--amber),0 0 18px rgba(255,201,60,.55),2px 2px 0 var(--magenta);
    text-indent:.45em; /* wyrównuje letter-spacing ostatniej litery */
  }
  .cabinet{
    position:relative;line-height:0;
    border:3px solid rgba(123,92,255,.65);
    border-radius:14px;
    padding:8px;
    background:linear-gradient(160deg, rgba(123,92,255,.14), rgba(255,62,165,.08));
    box-shadow:0 0 24px rgba(123,92,255,.35), inset 0 0 22px rgba(0,0,0,.7);
  }
  canvas{
    display:block;border-radius:8px;
    width:min(92vw, calc((100dvh - 150px) * 2 / 3));
    aspect-ratio:2/3;height:auto;
    background:#0B0817;
  }
  /* CRT: skanlinie + winieta */
  .cabinet::after{
    content:"";position:absolute;inset:8px;border-radius:8px;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(115% 115% at 50% 45%, transparent 62%, rgba(0,0,0,.5) 100%);
  }
  .hint{
    font-size:clamp(10px,1.6vw,13px);
    letter-spacing:.12em;opacity:.75;text-align:center;line-height:1.7;
  }
  .hint b{color:var(--amber);font-weight:700}
  @media (prefers-reduced-motion: no-preference){
    h1{animation:hum 4s ease-in-out infinite}
    @keyframes hum{0%,100%{opacity:1}50%{opacity:.88}}
  }
</style>
</head>
<body>
<h1>BZZZball</h1>
<div class="cabinet"><canvas id="game" aria-label="BZZZball — pinball, gra zręcznościowa"></canvas></div>
<p class="hint">
  <b>←</b> / <b>→</b> flippery &nbsp;·&nbsp; <b>SPACJA</b> (przytrzymaj i puść) wyrzutnia &nbsp;·&nbsp; <b>M</b> muzyka<br>
  dotyk: lewa / prawa połowa ekranu, start kulki — przytrzymaj i puść
</p>
<script>
(() => {
"use strict";
const W = 480, H = 720;
const G = 1500;              // grawitacja bazowa px/s^2
const MAXV = 1650;
const MAXLEVEL = 9;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

/* ---------- dźwięk (WebAudio, generowany) ---------- */
let AC = null, noiseBuf = null;
function audioOn(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === "suspended") AC.resume();
}
function beep(freq, dur, type, vol, slide){
  if (!AC) return;
  note(freq, AC.currentTime, dur, type, vol, slide);
}
function note(freq, t, dur, type, vol, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol || 0.04, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
function melody(freqs, step, dur, type, vol){
  if (!AC) return;
  const t = AC.currentTime;
  freqs.forEach((f,i) => note(f, t + i*step, dur, type, vol));
}
function noiseHit(t, vol){
  if (!AC) return;
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  }
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf;
  f.type = "highpass"; f.frequency.value = 5000;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(f).connect(g).connect(AC.destination);
  s.start(t);
}

/* ---------- muzyka: syntezatorowy loop, tempo rośnie z poziomem i FEVER ---------- */
const music = { on: true, next: 0, step: 0 };
const BASS = [45,45,48,45,43,43,41,43];      // MIDI, A-moll
const ARP  = [69,72,76,79,81,79,76,72];
const mtof = m => 440 * Math.pow(2, (m-69)/12);
function musicTick(){
  if (!AC || !music.on || (state !== "play" && state !== "video")){ if (AC) music.next = AC.currentTime + 0.1; return; }
  const bpm = 104 + level*8 + (effects.fever > 0 ? 24 : 0) + (state === "video" ? 28 : 0);
  const spb = 30/bpm;                        // ósemka
  if (music.next < AC.currentTime) music.next = AC.currentTime + 0.05;
  while (music.next < AC.currentTime + 0.3){
    const t = music.next, s = music.step;
    const oct = (Math.floor(s/8) % 4 === 3) ? 2 : 1;   // co czwarty takt oktawa wyżej
    note(mtof(BASS[s%8]), t, spb*0.85, "sawtooth", 0.035);
    note(mtof(ARP[s%8]) * oct, t, spb*0.5, "square", 0.015);
    if (s%2 === 0) noiseHit(t, 0.012);
    if (s%8 === 7) noiseHit(t, 0.022);
    music.next += spb; music.step++;
  }
}
setInterval(musicTick, 80);
function jingle(){ melody([523,659,784,1047], 0.09, 0.14, "square", 0.05); }

/* ---------- stan gry ---------- */
let state = "title";         // title | play | over
let score = 0, lives = 3, level = 1;
let hi = +(localStorage.getItem("bzzzball-hi") || 0);
let newHi = false;
let shake = 0, blink = 0, T = 0, flash = 0;
let ballsList = [];
const plunger = { power: 0, charging: false };
const msgs = [];             // komunikaty na planszy
const popups = [];           // wyskakujące punkty
const sparks = [];           // iskry
let combo = 0, lastHit = -9;
let fogCv = null;
const effects = { fever: 0, shield: 0, big: 0, slow: 0 };
const debuffs = { short: 0, heavy: 0, invert: 0, fog: 0 };   // klątwy
const honey = { t: 0, x: 222, y: 300, r: 46 };               // rozlany miód
const fin = { L: 0, R: 0 };                                  // wciśnięcia flipperów (liczniki)

function newBall(x,y,vx,vy){
  return { x, y, vx: vx||0, vy: vy||0, r: 9, trail: [], still: 0, warp: 0 };
}
function bR(){ return effects.big > 0 ? 15 : 9; }
function inLane(b){ return b.x > 424; }
function addScore(n){ score += n * level * (effects.fever > 0 ? 2 : 1); }
function say(text, dur){ msgs.push({ text, t: 0, dur: dur || 1.6 }); }
function popup(x, y, txt){
  popups.push({ x: Math.max(45, Math.min(435, x)), y, txt, t: 0 });
}
// wibracje (telefony z Androidem; iOS Safari nie wspiera navigator.vibrate)
function buzz(pattern){
  if (navigator.vibrate){ try { navigator.vibrate(pattern); } catch(e){} }
}
function spawnSparks(x, y, c, n, sp){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = (0.3+Math.random()*0.7)*(sp||260);
    sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60, life: 0.55, c });
  }
}
function registerHit(x, y, base){
  combo = (T - lastHit < 1.8) ? combo + 1 : 1;
  lastHit = T;
  const pts = base * level * (effects.fever > 0 ? 2 : 1);
  score += pts;
  buzz(12);
  popup(x, y - 14, "+" + pts + (combo >= 3 ? " ×" + combo : ""));
  if (combo > 0 && combo % 8 === 0){
    effects.fever = Math.max(effects.fever, 8);
    say("BZZZ FRENZY!  PUNKTY ×2", 2.2);
    melody([440,554,659,880,1109], 0.07, 0.12, "sawtooth", 0.05);
    flash = Math.max(flash, 0.25);
  }
}
function gravScale(){
  return (1 + Math.min(0.4, 0.06*(level-1))) * (debuffs.heavy > 0 ? 1.5 : 1);
}

/* ---------- geometria stołu ---------- */
const segs = [];
function seg(x1,y1,x2,y2,o){
  o = o || {};
  segs.push({x1,y1,x2,y2, rest:(o.rest!==undefined?o.rest:0.5),
             score:o.score||0, kick:o.kick||0, oneWay:!!o.oneWay,
             flash:0, draw:(o.draw!==false)});
}
// ściany boczne
seg(20,240,20,720);
seg(460,240,460,720);
// łuk górny (środek 240,240 R=220)
(function(){
  const cx=240, cy=240, R=220, N=26;
  for (let i=0;i<N;i++){
    const a1 = Math.PI + i*Math.PI/N, a2 = Math.PI + (i+1)*Math.PI/N;
    seg(cx+R*Math.cos(a1), cy+R*Math.sin(a1), cx+R*Math.cos(a2), cy+R*Math.sin(a2), {rest:.6});
  }
})();
// tor wyrzutni
seg(424,300,424,720);                          // ścianka toru
seg(426,652,460,652,{rest:.1,draw:false});     // podłoga toru (kulka na wyrzutni)
seg(424,300,458,264,{oneWay:true,rest:.4});    // bramka jednokierunkowa
// rynny prowadzące do flipperów
seg(20,505,142,640,{rest:.4});
seg(424,505,302,640,{rest:.4});
// slingshoty (przeciwprostokątna kopie i punktuje)
seg(130,528,172,598,{kick:330,score:50,rest:1});
seg(130,528,130,585,{rest:.5}); seg(130,585,172,598,{rest:.5});
seg(314,528,272,598,{kick:330,score:50,rest:1});
seg(314,528,314,585,{rest:.5}); seg(272,598,314,585,{rest:.5});

const bumpers = [
  {x:140,y:265,r:27,score:100,flash:0,c:"#28F2E4"},
  {x:304,y:265,r:27,score:100,flash:0,c:"#FF3EA5"},
  {x:222,y:155,r:24,score:150,flash:0,c:"#FFC93C"},
];
const posts = [ {x:424,y:300,r:5} ];

// gwiazdy w tle
const stars = Array.from({length:42}, () => ({
  x: 30 + Math.random()*420, y: 30 + Math.random()*660,
  s: 0.6 + Math.random()*1.4, ph: Math.random()*7,
}));

/* ---------- drop targety: zbij wszystkie = następny poziom ---------- */
let targets = [];
function spawnTargets(){
  const count = Math.min(3 + Math.floor((level-1)/2), 5);
  const spacing = 46, len = 26, y = 335;
  const x0 = 222 - (count-1)*spacing/2;
  targets = [];
  for (let i = 0; i < count; i++)
    targets.push({ x: x0 + i*spacing, y, len, r: 6, dead: false, flash: 0 });
}
spawnTargets();

/* ---------- rollovery B-Z-Z-Z pod łukiem ---------- */
let letters = [];
function resetLetters(){
  letters = [
    { ch:"B", x:150, y:105, lit:false },
    { ch:"Z", x:198, y: 88, lit:false },
    { ch:"Z", x:246, y: 88, lit:false },
    { ch:"Z", x:294, y:105, lit:false },
  ];
}
resetLetters();

/* ---------- bonusy do złapania ---------- */
const PICKUP_TYPES = [
  { k:"FEVER",  c:"#FFC93C", w:24 },
  { k:"SHIELD", c:"#28F2E4", w:20 },
  { k:"BIG",    c:"#FF3EA5", w:15 },
  { k:"SLOW",   c:"#7B5CFF", w:15 },
  { k:"MULTI",  c:"#FF6B35", w:16 },
  { k:"1UP",    c:"#7CFF6B", w:10 },
  { k:"TV",     c:"#9BE8FF", w:12 },
];
const PICKUP_SLOTS = [ [100,340],[344,340],[70,250],[374,250],[222,300] ];
let pickups = [], pickupTimer = 6;

/* ---------- klątwy: kolczaste kapsułki, których lepiej unikać ---------- */
const HAZARD_TYPES = [
  { k:"SHORT",  c:"#FF5A5A", sym:"✂", w:24 },
  { k:"HEAVY",  c:"#FF8A3C", sym:"▼", w:24 },
  { k:"INVERT", c:"#C94FFF", sym:"⇄", w:18 },
  { k:"FOG",    c:"#8A93B8", sym:"☁", w:16 },
  { k:"HONEY",  c:"#FFB020", sym:"≈", w:18 },
];
const HONEY_SLOTS = [ [150,430],[294,430],[222,300],[222,455] ];
let hazTimer = 14;
function spawnHazard(){
  if (pickups.filter(p => p.bad).length >= 2) return;
  const total = HAZARD_TYPES.reduce((a,t) => a+t.w, 0);
  let r = Math.random()*total, type = HAZARD_TYPES[0];
  for (const t of HAZARD_TYPES){ r -= t.w; if (r <= 0){ type = t; break; } }
  const slot = PICKUP_SLOTS[Math.floor(Math.random()*PICKUP_SLOTS.length)];
  pickups.push({ x: slot[0], y: slot[1], type, t: 0, life: 7, bad: true });
}
function applyHazard(p){
  const k = p.type.k;
  spawnSparks(p.x, p.y, p.type.c, 12, 300);
  buzz(70); shake = 5;
  beep(110, .5, "sawtooth", .07, -60);
  if (k === "SHORT"){ debuffs.short = 8;  say("KLĄTWA: KRÓTKIE FLIPPERY  8s", 2.2); }
  if (k === "HEAVY"){ debuffs.heavy = 8;  say("KLĄTWA: CIĘŻKA GRAWITACJA  8s", 2.2); }
  if (k === "INVERT"){ debuffs.invert = 6; say("KLĄTWA: ODWRÓCONE FLIPPERY!  6s", 2.2); }
  if (k === "FOG"){ debuffs.fog = 6;      say("KLĄTWA: ZAĆMIENIE  6s", 2.2); }
  if (k === "HONEY"){
    const s = HONEY_SLOTS[Math.floor(Math.random()*HONEY_SLOTS.length)];
    honey.t = 10; honey.x = s[0]; honey.y = s[1];
    say("ROZLANY MIÓD! LEPKA PUŁAPKA  10s", 2.2);
  }
  popup(p.x, p.y, p.type.sym);
}
function rollPickupType(){
  const total = PICKUP_TYPES.reduce((a,t) => a+t.w, 0);
  let r = Math.random()*total;
  for (const t of PICKUP_TYPES){ r -= t.w; if (r <= 0) return t; }
  return PICKUP_TYPES[0];
}
function spawnPickup(fx, fy){
  if (pickups.filter(p => !p.bad).length >= 2 && fx === undefined) return;
  const slot = PICKUP_SLOTS[Math.floor(Math.random()*PICKUP_SLOTS.length)];
  const taken = pickups.some(p => Math.abs(p.x-slot[0]) < 5 && Math.abs(p.y-slot[1]) < 5);
  const x = fx !== undefined ? fx : (taken ? slot[0] : slot[0]);
  pickups.push({ x: fx !== undefined ? fx : slot[0], y: fy !== undefined ? fy : slot[1],
                 type: rollPickupType(), t: 0, life: 9 });
}
function applyPickup(p, b){
  const k = p.type.k;
  spawnSparks(p.x, p.y, p.type.c, 14, 320);
  buzz([20,30,20]);
  if (k === "1UP"){
    lives++;
    say("EXTRA PSZCZOŁA! +1 ŻYCIE", 2);
    melody([660,880,1320], 0.1, 0.16, "square", 0.06);
  } else if (k === "MULTI"){
    ballsList.push(newBall(p.x, p.y, -220, -180), newBall(p.x, p.y, 220, -180));
    say("MULTIBALL!", 2.2);
    melody([392,523,659,784,1047,1319], 0.06, 0.12, "square", 0.055);
    flash = Math.max(flash, 0.3);
  } else if (k === "SHIELD"){
    effects.shield = 8;
    say("TARCZA NAD RYNNĄ  8s", 2);
    melody([330,494,659], 0.08, 0.14, "triangle", 0.06);
  } else if (k === "BIG"){
    effects.big = 10;
    say("WIELKA KULA!  10s", 2);
    beep(90, .35, "sawtooth", .07, 160);
  } else if (k === "SLOW"){
    effects.slow = 6;
    say("SLOW-MO  6s", 2);
    beep(700, .4, "sine", .06, -500);
  } else if (k === "FEVER"){
    effects.fever = Math.max(effects.fever, 10);
    say("FEVER!  PUNKTY ×2  10s", 2);
    melody([523,659,784], 0.07, 0.12, "square", 0.05);
  } else if (k === "TV"){
    startVideoMode();
  }
  popup(p.x, p.y, k === "1UP" ? "1UP!" : k);
}

/* ---------- futurystyczny tunel (od poziomu 2) ---------- */
const PORTAL_OUTS = [ [352,112], [128,112], [60,180], [384,180] ];
const portal = {
  in: {x:64, y:440, r:13}, out: {x:352, y:112, r:13},
  cool: 0, moveT: 12, blink: 0,
};
function portalActive(){ return level >= 2; }
function relocatePortalOut(){
  const options = PORTAL_OUTS.filter(([x,y]) => x !== portal.out.x || y !== portal.out.y);
  const [nx, ny] = options[Math.floor(Math.random()*options.length)];
  spawnSparks(portal.out.x, portal.out.y, "#FF3EA5", 10, 220);
  portal.out.x = nx; portal.out.y = ny;
  portal.blink = 0.8; portal.moveT = 12;
  spawnSparks(nx, ny, "#FF3EA5", 12, 260);
  beep(1000, .15, "sine", .04, -550);
}

/* ---------- lasery (poziom 3+: jeden, 6+: dwa) ---------- */
const LASERS = [ {y:420, phase:0}, {y:380, phase:Math.PI} ];
function laserCount(){ return level >= 6 ? 2 : (level >= 3 ? 1 : 0); }
function laserX(i){
  const w = 0.9 + 0.12*level;
  return 222 + Math.sin(T*w + LASERS[i].phase) * 112;
}
const LASER_HALF = 40, LASER_R = 5;

/* ---------- wir magnetyczny (poziom 4+) ---------- */
const vortex = { x:222, y:495, R:110, F:280 };
function vortexActive(){ return level >= 4; }

/* ---------- wiatrak (poziom 5+) ---------- */
const rotor = { x:222, y:250, len:50, r:5 };
function rotorActive(){ return level >= 5; }
function rotorAng(){ return T * (2.0 + 0.15*level); }

/* ---------- PAJĄK — hołd dla "The Power" z The Addams Family ---------- */
const spider = { phase: "idle", timer: 20, y: -30, x: 0, hold: 0, mash: 0, ball: null };
function spiderMash(){
  if (spider.phase === "hold"){ spider.hold -= 0.22; spider.mash++; }
}
function spiderThrow(){
  const b = spider.ball;
  const a = -Math.PI/2 + (Math.random()-.5)*1.7;
  const v = 650 + Math.random()*350;
  b.held = false; b.vx = Math.cos(a)*v; b.vy = Math.sin(a)*v;
  if (spider.mash >= 6){ addScore(300); popup(b.x, b.y-20, "UCIEKŁA! +" + 300*level*(effects.fever>0?2:1)); }
  spawnSparks(b.x, b.y, "#B9AEE8", 10);
  beep(300, .2, "square", .06, 300); buzz(30);
  spider.phase = "up";
  spider.timer = 22 + Math.random()*14;
}
function updSpider(dt){
  if (spider.phase === "idle"){
    spider.timer -= dt;
    if (spider.timer <= 0){
      const prey = ballsList.find(b => !b.warp && !b.held && b.y > 150 && b.y < 480 && b.x > 60 && b.x < 380);
      if (prey){
        spider.phase = "drop"; spider.ball = prey; spider.y = -30; spider.x = prey.x;
        prey.held = true; prey.vx = 0; prey.vy = 0; prey.trail.length = 0;
        spider.mash = 0;
        say("PAJĄK ZŁAPAŁ PSZCZOŁĘ!  MASH ← →", 2.2);
        beep(160, .5, "sawtooth", .05, -100); buzz([40,60,40]);
      } else spider.timer = 3;
    }
  } else if (spider.phase === "drop"){
    spider.y += 600*dt; spider.x = spider.ball.x;
    if (spider.y >= spider.ball.y - 24){ spider.y = spider.ball.y - 24; spider.phase = "hold"; spider.hold = 1.6; }
  } else if (spider.phase === "hold"){
    spider.x = spider.ball.x;
    spider.hold -= dt;
    if (spider.hold <= 0) spiderThrow();
  } else if (spider.phase === "up"){
    spider.y -= 700*dt;
    if (spider.y < -30){ spider.phase = "idle"; spider.ball = null; }
  }
}

/* ---------- boss: KRÓLOWA OS — hołd dla Attack from Mars ---------- */
const queen = { alive: false, hp: 0, max: 0, hitCool: 0 };
function queenPos(){
  return { x: 222 + Math.sin(T*0.7)*120, y: 185 + Math.sin(T*1.13)*45 };
}
function collideQueen(b){
  const qp = queenPos();
  let nx = b.x-qp.x, ny = b.y-qp.y;
  const d = Math.hypot(nx,ny), rr = b.r + 19;
  if (d >= rr || d === 0) return;
  nx/=d; ny/=d;
  const vn = b.vx*nx + b.vy*ny;
  b.x = qp.x + nx*rr; b.y = qp.y + ny*rr;
  if (vn < 0){ b.vx -= 2*vn*nx; b.vy -= 2*vn*ny; b.vx += nx*120; b.vy += ny*120; }
  if (queen.hitCool <= 0 && vn < -140){
    queen.hitCool = 0.5; queen.hp--;
    registerHit(qp.x, qp.y, 300);
    spawnSparks(qp.x, qp.y, "#FF6B35", 10);
    beep(880, .08, "square", .06, -300);
    if (queen.hp <= 0){
      queen.alive = false;
      addScore(2000);

/* ---------- skill shot (klasyka Williamsa): traf w podświetloną strefę mocy ---------- */
const SS_MIN = 0.6, SS_MAX = 0.78;

/* ---------- flippery ---------- */
function mkFlipper(px,py,dir){
  return {px,py,dir,len:62,r:10,rest:.55,active:-.7,ang:.55,vel:0,on:false};
}
const flippers = [ mkFlipper(146,645,1), mkFlipper(298,645,-1) ];
function effLen(f){ return f.len * (debuffs.short > 0 ? 0.62 : 1); }
function flipTip(f){
  const L = effLen(f);
  return { x: f.px + f.dir*Math.cos(f.ang)*L, y: f.py + Math.sin(f.ang)*L };
}
function updFlipper(f,dt){
  const target = f.on ? f.active : f.rest;
  const sp = f.on ? 17 : 11;
  const prev = f.ang;
  if (f.ang < target) f.ang = Math.min(target, f.ang + sp*dt);
  else if (f.ang > target) f.ang = Math.max(target, f.ang - sp*dt);
  f.vel = (f.ang - prev)/dt;
}

/* ---------- kolizje ---------- */
function collideSeg(b,s){
  if (s.oneWay && b.vy <= 0) return;
  const dx = s.x2-s.x1, dy = s.y2-s.y1;
  const L2 = dx*dx+dy*dy;
  let t = ((b.x-s.x1)*dx + (b.y-s.y1)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = s.x1+t*dx, cy = s.y1+t*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny);
  if (d >= b.r || d === 0) return;
  nx/=d; ny/=d;
  b.x = cx + nx*b.r; b.y = cy + ny*b.r;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+s.rest)*vn*nx;
    b.vy -= (1+s.rest)*vn*ny;
    // lekkie tarcie styczne, żeby kulka ładnie się toczyła
    const tx=-ny, ty=nx, vt=b.vx*tx+b.vy*ty;
    b.vx -= tx*vt*0.02; b.vy -= ty*vt*0.02;
    if (s.kick){
      b.vx += nx*s.kick; b.vy += ny*s.kick;
      s.flash = 1; shake = 3;
      beep(480+Math.random()*90, .08, "square", .055);
      spawnSparks(cx, cy, "#FF3EA5", 7);
      if (s.score) registerHit(cx, cy, s.score);
    } else if (vn < -260){
      beep(120, .04, "triangle", .03);
    }
  }
}
function collideCircle(b,p,kick,scoreVal){
  let nx=b.x-p.x, ny=b.y-p.y;
  const d = Math.hypot(nx,ny), rr = b.r+p.r;
  if (d >= rr) return;
  nx/=(d||1); ny/=(d||1);
  b.x = p.x + nx*rr; b.y = p.y + ny*rr;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){ b.vx -= 2*vn*nx; b.vy -= 2*vn*ny; }
  if (kick){
    b.vx += nx*kick; b.vy += ny*kick;
    p.flash = 1; shake = 4;
    registerHit(p.x, p.y, scoreVal);
    spawnSparks(b.x, b.y, p.c || "#FFC93C", 9);
    beep(200+Math.random()*220, .09, "square", .06, -80);
  }
}
// statyczna kapsuła (drop targety, lasery, tarcza); zwraca normalną albo null
function collideCapsule(b, x1,y1,x2,y2, rad, rest){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy || 1;
  let t = ((b.x-x1)*dx + (b.y-y1)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*dx, cy = y1+t*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny), rr = b.r+rad;
  if (d >= rr || d === 0) return null;
  nx/=d; ny/=d;
  b.x = cx + nx*rr; b.y = cy + ny*rr;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){ b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny; }
  return { nx, ny, vn };
}
// wirujący wiatrak: kapsuła obracająca się wokół środka, oddaje pęd obrotu
function collideRotor(b){
  const ang = rotorAng(), w = 2.0 + 0.15*level;
  const dx = Math.cos(ang)*rotor.len, dy = Math.sin(ang)*rotor.len;
  const x1 = rotor.x-dx, y1 = rotor.y-dy, x2 = rotor.x+dx, y2 = rotor.y+dy;
  const ddx = x2-x1, ddy = y2-y1, L2 = ddx*ddx+ddy*ddy;
  let t = ((b.x-x1)*ddx + (b.y-y1)*ddy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*ddx, cy = y1+t*ddy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny), rr = b.r+rotor.r;
  if (d >= rr || d === 0) return;
  nx/=d; ny/=d;
  b.x = cx + nx*rr; b.y = cy + ny*rr;
  const rx = cx-rotor.x, ry = cy-rotor.y;
  const vfx = -w*ry, vfy = w*rx;            // prędkość punktu styku ramienia
  const rvx = b.vx-vfx, rvy = b.vy-vfy;
  const vn = rvx*nx + rvy*ny;
  if (vn < 0){
    b.vx -= 1.8*vn*nx; b.vy -= 1.8*vn*ny;
    shake = 4;
    buzz(15);
    spawnSparks(cx, cy, "#FF6B35", 8);
    beep(150, .08, "sawtooth", .06, 250);
  }
}
function collideFlipper(b,f){
  const tip = flipTip(f);
  const dx = tip.x-f.px, dy = tip.y-f.py;
  const L2 = dx*dx+dy*dy;
  let t = ((b.x-f.px)*dx + (b.y-f.py)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = f.px+t*dx, cy = f.py+t*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny), rr = b.r+f.r;
  if (d >= rr || d === 0) return;
  nx/=d; ny/=d;
  b.x = cx + nx*rr; b.y = cy + ny*rr;
  // prędkość punktu styku na flipperze (obrót wokół osi)
  const s = Math.sin(f.ang), c = Math.cos(f.ang);
  const vfx = (f.dir===1 ? -s : s) * effLen(f) * t * f.vel;
  const vfy = c * effLen(f) * t * f.vel;
  const rvx = b.vx - vfx, rvy = b.vy - vfy;
  const vn = rvx*nx + rvy*ny;
  if (vn < 0){
    const e = 0.4;
    b.vx -= (1+e)*vn*nx;
    b.vy -= (1+e)*vn*ny;
  }
}

function releasePlunger(){

}
function ballOnPlunger(){
  return state === "play" &&
    ballsList.some(b => inLane(b) && b.y > 560 && Math.abs(b.vy) < 60);
}

function step(dt){
  T += dt;
  // odwrócona klątwa zamienia strony flipperów
  const inv = debuffs.invert > 0;
  flippers[0].on = (inv ? fin.R : fin.L) > 0;
  flippers[1].on = (inv ? fin.L : fin.R) > 0;
  flippers.forEach(f => updFlipper(f, dt));
  segs.forEach(s => { if (s.flash>0) s.flash = Math.max(0, s.flash - dt*3.5); });
  bumpers.forEach(p => { if (p.flash>0) p.flash = Math.max(0, p.flash - dt*3.5); });
  targets.forEach(tg => { if (tg.flash>0) tg.flash = Math.max(0, tg.flash - dt*3.5); });
  if (flash > 0) flash = Math.max(0, flash - dt*1.6);
  for (let i = sparks.length-1; i >= 0; i--){
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0){ sparks.splice(i,1); continue; }
    s.vy += 700*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
  }
  if (state === "video"){ stepVideo(dt); return; }
  if (state !== "play") return;

  for (const k in effects) if (effects[k] > 0) effects[k] = Math.max(0, effects[k] - dt);
  for (const k in debuffs) if (debuffs[k] > 0) debuffs[k] = Math.max(0, debuffs[k] - dt);
  if (honey.t > 0) honey.t = Math.max(0, honey.t - dt);

  // bumper centralny ucieka od poziomu 7
  bumpers[2].x = level >= 7 ? 222 + Math.sin(T*1.1)*58 : 222;

  // pojawianie się bonusów
  pickupTimer -= dt;
  if (pickupTimer <= 0){
    spawnPickup();
    pickupTimer = 9 + Math.random()*4;
  }
  if (level >= 2){
    hazTimer -= dt;
    if (hazTimer <= 0){
      spawnHazard();
      hazTimer = Math.max(7, 15 - level) + Math.random()*4;   // im wyżej, tym częściej
    }
  }
  for (let i = pickups.length-1; i >= 0; i--){
    pickups[i].t += dt;
    if (pickups[i].t > pickups[i].life) pickups.splice(i,1);
  }

  if (plunger.charging && ballOnPlunger()) plunger.power = Math.min(1, plunger.power + dt*1.15);
  if (portal.cool > 0) portal.cool -= dt;
  if (portal.blink > 0) portal.blink -= dt;
  if (portalActive()){
    portal.moveT -= dt;
    // wylot nie przeskakuje, gdy ktoś właśnie leci tunelem
    if (portal.moveT <= 0 && !ballsList.some(b => b.warp > 0)) relocatePortalOut();
  }
  if (queen.hitCool > 0) queen.hitCool -= dt;
  updSpider(dt);

  const dtb = dt * (effects.slow > 0 ? 0.55 : 1);   // slow-mo działa na kulki

  for (const b of ballsList){
    b.r = bR();

    // podróż tunelem: kulka znika, po chwili wypada z drugiego końca
    if (b.warp > 0){
      b.warp -= dtb;
      if (b.warp <= 0){
        b.x = portal.out.x; b.y = portal.out.y;
        b.vx = (222 - portal.out.x) * 0.5;   // zawsze w stronę środka planszy
        b.vy = 260;
        b.trail.length = 0;
        beep(880, .18, "sine", .06, -400);
        if (Math.random() < 0.6) relocatePortalOut();
      }
      continue;
    }

    if (b.held) continue;   // kulka w łapach pająka

    b.vy += G * gravScale() * dtb;

    // wir magnetyczny ciągnie w stronę rynny
    if (vortexActive()){
      const dx = vortex.x-b.x, dy = vortex.y-b.y;
      const d = Math.hypot(dx,dy);
      if (d < vortex.R && d > 5){
        const f = vortex.F * (1 - d/vortex.R);
        b.vx += dx/d * f * dtb;
        b.vy += dy/d * f * dtb;
      }
    }

    b.x += b.vx*dtb;
    b.y += b.vy*dtb;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > MAXV){ b.vx *= MAXV/sp; b.vy *= MAXV/sp; }

    // lepki miód mocno wyhamowuje
    if (honey.t > 0 && Math.hypot(b.x-honey.x, b.y-honey.y) < honey.r){
      const m = Math.max(0, 1 - 6*dtb);
      b.vx *= m; b.vy *= m;
      const hs = Math.hypot(b.vx, b.vy);
      if (hs > 330){ b.vx *= 330/hs; b.vy *= 330/hs; }
    }

    segs.forEach(s => collideSeg(b, s));
    if (effects.shield > 0){
      const hit = collideCapsule(b, 150, 690, 294, 690, 6, 1.1);
      if (hit){ spawnSparks(b.x, b.y+10, "#28F2E4", 8); beep(240, .1, "sine", .06, 200); }
    }
    bumpers.forEach(p => collideCircle(b, p, 300, p.score));
    posts.forEach(p => collideCircle(b, p, 0, 0));
    flippers.forEach(f => collideFlipper(b, f));
    if (rotorActive()) collideRotor(b);
    if (queen.alive) collideQueen(b);

    // drop targety
    targets.forEach(tg => {
      if (tg.dead) return;
      const hit = collideCapsule(b, tg.x - tg.len/2, tg.y, tg.x + tg.len/2, tg.y, tg.r, 0.7);
      if (hit){
        tg.dead = true;
        registerHit(tg.x, tg.y, 250);
        spawnSparks(tg.x, tg.y, "#FFC93C", 10);
        shake = 3;
        beep(1200, .1, "square", .05, -500);
      }
    });

    // lasery odbijają kulkę
    for (let i = 0; i < laserCount(); i++){
      const lx = laserX(i), ly = LASERS[i].y;
      const hit = collideCapsule(b, lx-LASER_HALF, ly, lx+LASER_HALF, ly, LASER_R, 0.6);
      if (hit){
        b.vx += hit.nx*230; b.vy += hit.ny*230;
        shake = 4;
        buzz(15);
        spawnSparks(b.x, b.y, "#FF2E2E", 8);
        beep(60, .12, "sawtooth", .07, 900);
      }
    }

    // rollovery B-Z-Z-Z (sensory, nie odbijają)
    letters.forEach((L,i) => {
      if (L.lit) return;
      if (Math.hypot(b.x-L.x, b.y-L.y) < 13 + b.r){
        L.lit = true;
        addScore(50);
        popup(L.x, L.y, L.ch + "!");
        spawnSparks(L.x, L.y, "#28F2E4", 6);
        beep(600 + i*140, .1, "square", .05);
        if (letters.every(l => l.lit)){
          addScore(1000);
          say("B-Z-Z-Z!  +" + 1000*level*(effects.fever>0?2:1) + "  BONUS!", 2.4);
          melody([784,988,1175,1568], 0.08, 0.14, "square", 0.055);
          spawnPickup(222, 300);
          flash = Math.max(flash, 0.3);
          resetLetters();
        }
      }
    });

    // łapanie bonusów
    for (let i = pickups.length-1; i >= 0; i--){
      const p = pickups[i];
      if (Math.hypot(b.x-p.x, b.y-p.y) < 13 + b.r){
        pickups.splice(i,1);
        if (p.bad) applyHazard(p);
        else applyPickup(p, b);
      }
    }

    // wejście do tunelu
    if (portalActive() && portal.cool <= 0){
      const d = Math.hypot(b.x-portal.in.x, b.y-portal.in.y);
      if (d < portal.in.r + b.r){
        b.warp = 0.45; portal.cool = 1.6;
        addScore(500);
        say("TUNEL! +" + 500*level*(effects.fever>0?2:1), 1.4);
        spawnSparks(portal.in.x, portal.in.y, "#28F2E4", 12, 300);
        beep(300, .4, "sine", .07, 900);
      }
    }

    // anty-zakleszczenie: kulka nieruchoma poza wyrzutnią dostaje kuksańca
    if (!inLane(b) && Math.hypot(b.vx, b.vy) < 12){
      b.still += dt;
      if (b.still > 3){
        b.vy -= 260;
        b.vx += (b.x < 222 ? 1 : -1) * (80 + Math.random()*80);
        b.still = 0;
        shake = 5;
        beep(70, .12, "triangle", .06);
      }
    } else {
      b.still = 0;
    }
  }

  // spadek do rynny
  const before = ballsList.length;
  ballsList = ballsList.filter(b => b.y <= H + 40);
  if (ballsList.length < before && ballsList.length > 0)
    say(ballsList.length === 1 ? "OSTATNIA KULKA!" : "", 1.2);
  if (ballsList.length === 0) loseLife();

  // wszystkie targety zbite -> nowy poziom
  if (targets.length && targets.every(tg => tg.dead)) levelUp();

  // aktualizacja popupów
  for (let i = popups.length-1; i >= 0; i--){
    popups[i].t += dt;
    if (popups[i].t > 0.9) popups.splice(i,1);
  }
}

/* ---------- rysowanie ---------- */
function neonStroke(color, w, blur){
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.shadowColor = color; ctx.shadowBlur = blur;
}
function text(str, x, y, size, color, align, glow){
  ctx.font = "700 " + size + "px 'Courier New', monospace";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = glow === undefined ? 8 : glow;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}
function drawBee(x, y, r, wings){
  if (wings){
    ctx.globalAlpha = 0.35 + 0.3*Math.abs(Math.sin(T*26));
    ctx.fillStyle = "#CFEBFF";
    [[-r*0.7,-r*1.1],[r*0.7,-r*1.1]].forEach(([ox,oy]) => {
      ctx.beginPath();
      ctx.ellipse(x+ox, y+oy, r*0.62, r*0.34, ox<0?-0.6:0.6, 0, 7);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  const g = ctx.createRadialGradient(x-r*0.3, y-r*0.3, 1, x, y, r);
  g.addColorStop(0,"#FFE985"); g.addColorStop(1,"#F5A623");
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = g;
  ctx.shadowColor = "#FFC93C"; ctx.shadowBlur = 12;
  ctx.fill(); ctx.shadowBlur = 0;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r-0.5, 0, 7); ctx.clip();
  ctx.fillStyle = "rgba(43,30,10,.85)";
  ctx.fillRect(x - r*0.66, y-r, r*0.33, r*2);
  ctx.fillRect(x + r*0.05, y-r, r*0.33, r*2);
  ctx.restore();
}
function drawStars(){
  stars.forEach(st => {
    ctx.globalAlpha = 0.25 + 0.35*(0.5 + 0.5*Math.sin(T*1.7 + st.ph));
    ctx.fillStyle = "#B9AEE8";
    ctx.fillRect(st.x, st.y, st.s, st.s);
  });
  ctx.globalAlpha = 1;
}
function drawVideo(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = "#060410";
  ctx.fillRect(-8,-8,W+16,H+16);
  drawStars();
  text("VIDEO MODE", 240, 26, 18, "#9BE8FF", "center", 12);
  neonStroke("#9BE8FF", 3, 12);
  ctx.strokeRect(30, 50, 420, 540);
  ctx.shadowBlur = 0;
  // pasek czasu
  ctx.fillStyle = "#FFC93C";
  ctx.shadowColor = "#FFC93C"; ctx.shadowBlur = 8;
  ctx.fillRect(30, 598, 420*Math.max(0, vm.t/14), 6);
  ctx.shadowBlur = 0;
  ctx.save();
  ctx.beginPath(); ctx.rect(32, 52, 416, 536); ctx.clip();
  vm.gates.forEach(g => {
    neonStroke("#7B5CFF", 2.5, 10);
    ctx.fillStyle = "rgba(123,92,255,.25)";
    ctx.fillRect(g.x-13, 52, 26, g.c-70-52);
    ctx.strokeRect(g.x-13, 52, 26, g.c-70-52);
    ctx.fillRect(g.x-13, g.c+70, 26, 588-(g.c+70));
    ctx.strokeRect(g.x-13, g.c+70, 26, 588-(g.c+70));
    ctx.shadowBlur = 0;
  });
  drawBee(120, vm.y, 13, true);
  sparks.forEach(s => {
    ctx.globalAlpha = Math.max(0, s.life/0.55);
    ctx.fillStyle = s.c;
    ctx.fillRect(s.x-1.5, s.y-1.5, 3, 3);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  if (vm.over > 0) text(vm.msg, 240, 320, 34, "#FF3EA5", "center", 18);
  text("BONUS  " + vm.score, 240, 634, 16, "#EDE9FF", "center", 6);
  text("SPACJA / DOTYK = LOT", 240, 664, 12, "#B9AEE8", "center", 0);
}
function draw(){
  if (state === "video"){ drawVideo(); return; }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (shake > 0.2){
    ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
    shake *= 0.86;
  }
  ctx.fillStyle = "#0B0817";
  ctx.fillRect(-8,-8,W+16,H+16);

  // gwiazdy
  drawStars();

  // delikatna poświata planszy
  const bg = ctx.createRadialGradient(240,300,40, 240,300,420);
  bg.addColorStop(0,"rgba(123,92,255,.10)");
  bg.addColorStop(1,"rgba(123,92,255,0)");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // ściany
  ctx.lineCap = "round";
  neonStroke("#7B5CFF", 4, 10);
  ctx.beginPath();
  segs.forEach(s => {
    if (!s.draw || s.oneWay || s.kick) return;
    ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2);
  });
  ctx.stroke();

  // bramka jednokierunkowa (przerywana)
  neonStroke("#28F2E4", 2, 6);
  ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(424,300); ctx.lineTo(458,264); ctx.stroke();
  ctx.setLineDash([]);

  // rollovery B-Z-Z-Z
  letters.forEach(L => {
    neonStroke(L.lit ? "#FFC93C" : "#4A3F6E", 2, L.lit ? 12 : 0);
    ctx.beginPath(); ctx.arc(L.x, L.y, 13, 0, 7);
    if (L.lit){
      ctx.fillStyle = "rgba(255,201,60,.25)";
      ctx.fill();
    }
    ctx.stroke();
    text(L.ch, L.x, L.y+1, 13, L.lit ? "#FFC93C" : "#6B6485", "center", L.lit ? 8 : 0);
  });

  // slingshoty
  [[130,528,130,585,172,598],[314,528,314,585,272,598]].forEach((p,i) => {
    const hyp = segs.find(s => s.kick && (i===0 ? s.x1===130 : s.x1===314));
    const hot = hyp && hyp.flash > 0;
    ctx.beginPath();
    ctx.moveTo(p[0],p[1]); ctx.lineTo(p[2],p[3]); ctx.lineTo(p[4],p[5]); ctx.closePath();
    ctx.fillStyle = hot ? "rgba(255,62,165,.85)" : "rgba(255,62,165,.22)";
    ctx.fill();
    neonStroke("#FF3EA5", 2.5, hot ? 18 : 8);
    ctx.stroke();
  });

  // bumpery
  bumpers.forEach(p => {
    const f = p.flash;
    const grad = ctx.createRadialGradient(p.x,p.y,2, p.x,p.y,p.r);
    grad.addColorStop(0, f>0 ? "#FFFFFF" : p.c);
    grad.addColorStop(1, "rgba(11,8,23,.9)");
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r + f*4,0,7);
    ctx.fillStyle = grad;
    ctx.shadowColor = p.c; ctx.shadowBlur = 14 + f*22;
    ctx.fill();
    neonStroke(p.c, 3, 0);
    ctx.stroke();
    ctx.shadowBlur = 0;
    text(String(p.score), p.x, p.y, 11, f>0 ? "#0B0817" : p.c, "center", 0);
  });

  // KRÓLOWA OS
  if (queen.alive){
    const qp = queenPos();
    ctx.globalAlpha = 0.4 + 0.3*Math.abs(Math.sin(T*22));
    ctx.fillStyle = "#FFD7B0";
    [[-14,-16],[14,-16]].forEach(([ox,oy]) => {
      ctx.beginPath();
      ctx.ellipse(qp.x+ox, qp.y+oy, 13, 7, ox<0?-0.6:0.6, 0, 7);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    const qg = ctx.createRadialGradient(qp.x-5, qp.y-5, 2, qp.x, qp.y, 19);
    qg.addColorStop(0,"#FFB066"); qg.addColorStop(1,"#C43A1B");
    ctx.beginPath(); ctx.arc(qp.x, qp.y, 19, 0, 7);
    ctx.fillStyle = qg;
    ctx.shadowColor = queen.hitCool > 0.3 ? "#FFFFFF" : "#FF2E2E";
    ctx.shadowBlur = 16;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.save();
    ctx.beginPath(); ctx.arc(qp.x, qp.y, 18.5, 0, 7); ctx.clip();
    ctx.fillStyle = "rgba(43,20,5,.85)";
    ctx.fillRect(qp.x-13, qp.y-19, 6, 38);
    ctx.fillRect(qp.x-1, qp.y-19, 6, 38);
    ctx.fillRect(qp.x+11, qp.y-19, 6, 38);
    ctx.restore();
    ctx.fillStyle = "#FF2E2E";
    ctx.fillRect(qp.x-8, qp.y-8, 4, 4);
    ctx.fillRect(qp.x+4, qp.y-8, 4, 4);
    // pasek HP
    for (let i = 0; i < queen.max; i++){
      ctx.fillStyle = i < queen.hp ? "#FFC93C" : "rgba(74,63,110,.8)";
      ctx.fillRect(qp.x - queen.max*5 + i*10, qp.y-34, 7, 4);
    }
  }

  // wiatrak
  if (rotorActive()){
    const ang = rotorAng();
    const dx = Math.cos(ang)*rotor.len, dy = Math.sin(ang)*rotor.len;
    neonStroke("#FF6B35", rotor.r*2, 12);
    ctx.beginPath();
    ctx.moveTo(rotor.x-dx, rotor.y-dy); ctx.lineTo(rotor.x+dx, rotor.y+dy);
    ctx.stroke();
    ctx.shadowBlur = 0;
    [[rotor.x-dx,rotor.y-dy],[rotor.x+dx,rotor.y+dy]].forEach(([ex,ey]) => {
      ctx.beginPath(); ctx.arc(ex,ey,4,0,7);
      ctx.fillStyle = "#FFD7B0"; ctx.fill();
    });
    ctx.beginPath(); ctx.arc(rotor.x, rotor.y, 6, 0, 7);
    ctx.fillStyle = "#FF6B35"; ctx.shadowColor = "#FF6B35"; ctx.shadowBlur = 10;
    ctx.fill(); ctx.shadowBlur = 0;
  }

  // drop targety
  targets.forEach(tg => {
    if (tg.dead) return;
    neonStroke("#FFC93C", tg.r*2, 10);
    ctx.beginPath();
    ctx.moveTo(tg.x - tg.len/2, tg.y); ctx.lineTo(tg.x + tg.len/2, tg.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(11,8,23,.5)"; ctx.lineWidth = tg.r*2 - 5;
    ctx.beginPath();
    ctx.moveTo(tg.x - tg.len/2, tg.y); ctx.lineTo(tg.x + tg.len/2, tg.y);
    ctx.stroke();
  });

  // tunel: dwa wirujące pierścienie + wiązka podczas teleportu
  if (portalActive()){
    [[portal.in,"#28F2E4",1],[portal.out,"#FF3EA5",-1]].forEach(([p,c,dir]) => {
      // świeżo przeniesiony wylot migocze podczas materializacji
      if (dir === -1 && portal.blink > 0)
        ctx.globalAlpha = 0.35 + 0.65*Math.abs(Math.sin(T*22));
      neonStroke(c, 3, 12);
      ctx.setLineDash([7,6]);
      ctx.lineDashOffset = dir * T * 26;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      const g = ctx.createRadialGradient(p.x,p.y,1, p.x,p.y,p.r);
      g.addColorStop(0, c); g.addColorStop(1, "rgba(11,8,23,0)");
      ctx.globalAlpha = 0.5 + 0.2*Math.sin(T*5);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r-3,0,7);
      ctx.fillStyle = g; ctx.fill();
      ctx.globalAlpha = 1;
    });
    if (ballsList.some(b => b.warp > 0)){
      neonStroke("#28F2E4", 2, 14);
      ctx.setLineDash([4,9]);
      ctx.lineDashOffset = -T * 160;
      ctx.beginPath();
      ctx.moveTo(portal.in.x, portal.in.y);
      ctx.lineTo(portal.out.x, portal.out.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
    }
  }

  // wir magnetyczny
  if (vortexActive()){
    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 3; i++){
      const r = 16 + i*13;
      neonStroke("#7B5CFF", 2, 8);
      ctx.beginPath();
      ctx.arc(vortex.x, vortex.y, r, T*1.6 + i*2.1, T*1.6 + i*2.1 + 3.6);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // lasery
  for (let i = 0; i < laserCount(); i++){
    const lx = laserX(i), ly = LASERS[i].y;
    neonStroke("#FF2E2E", 6, 16 + 6*Math.sin(T*9));
    ctx.beginPath(); ctx.moveTo(lx-LASER_HALF, ly); ctx.lineTo(lx+LASER_HALF, ly); ctx.stroke();
    neonStroke("#FFD7D7", 2, 0);
    ctx.beginPath(); ctx.moveTo(lx-LASER_HALF, ly); ctx.lineTo(lx+LASER_HALF, ly); ctx.stroke();
    [[lx-LASER_HALF,ly],[lx+LASER_HALF,ly]].forEach(([ex,ey]) => {
      ctx.beginPath(); ctx.arc(ex,ey,4,0,7);
      ctx.fillStyle = "#FF2E2E"; ctx.shadowColor = "#FF2E2E"; ctx.shadowBlur = 10;
      ctx.fill(); ctx.shadowBlur = 0;
    });
  }

  // kałuża miodu
  if (honey.t > 0){
    ctx.globalAlpha = Math.min(1, honey.t / 1.5);
    ctx.beginPath();
    for (let i = 0; i <= 14; i++){
      const a = i/14 * Math.PI*2;
      const r = honey.r * (0.86 + 0.14*Math.sin(T*2.2 + i*2.4));
      const px = honey.x + Math.cos(a)*r, py = honey.y + Math.sin(a)*r*0.85;
      i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(255,176,32,.28)";
    ctx.fill();
    neonStroke("#FFB020", 2, 10);
    ctx.stroke();
    ctx.shadowBlur = 0;
    text("≈", honey.x, honey.y, 18, "#FFB020", "center", 6);
    ctx.globalAlpha = 1;
  }

  // bonusy (sześciokąty) i klątwy (kolczaste gwiazdy)
  pickups.forEach(p => {
    const bob = Math.sin(T*3 + p.x) * 4;
    const dying = p.life - p.t < 2;
    if (dying && Math.floor(p.t*6) % 2 === 0) return;   // miga przed zniknięciem
    const y = p.y + bob;
    neonStroke(p.type.c, 2.5, 12);
    ctx.beginPath();
    if (p.bad){
      for (let i = 0; i < 16; i++){
        const a = i*Math.PI/8 - T*1.2;
        const r = i % 2 === 0 ? 16 : 8;
        const px = p.x + Math.cos(a)*r, py = y + Math.sin(a)*r;
        i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
    } else {
      for (let i = 0; i < 6; i++){
        const a = Math.PI/6 + i*Math.PI/3 + T*0.8;
        const px = p.x + Math.cos(a)*14, py = y + Math.sin(a)*14;
        i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
    }
    ctx.closePath();
    ctx.fillStyle = p.bad ? "rgba(40,6,10,.8)" : "rgba(11,8,23,.75)";
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    text(p.bad ? p.type.sym : (p.type.k === "1UP" ? "1UP" : p.type.k[0]),
         p.x, y+1, 11, p.type.c, "center", 6);
  });

  // tarcza nad rynną
  if (effects.shield > 0){
    ctx.globalAlpha = effects.shield < 2 ? (Math.floor(T*6)%2 ? 0.3 : 0.9) : 0.9;
    neonStroke("#28F2E4", 5, 16 + 5*Math.sin(T*7));
    ctx.beginPath(); ctx.moveTo(150,690); ctx.lineTo(294,690); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // słupki
  posts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7);
    ctx.fillStyle = "#7B5CFF"; ctx.shadowColor="#7B5CFF"; ctx.shadowBlur=8;
    ctx.fill(); ctx.shadowBlur=0;
  });

  // flippery
  flippers.forEach(f => {
    const tip = flipTip(f);
    neonStroke("#FFC93C", f.r*2, 14);
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(11,8,23,.55)"; ctx.lineWidth = f.r*2 - 7;
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  });

  // wyrzutnia (sprężyna)
  const px0 = 428, pw = 28;
  const compress = plunger.charging ? plunger.power : 0;
  const springTop = 654 + compress*34;
  neonStroke("#FF3EA5", 2, 6);
  ctx.beginPath();
  for (let y = springTop; y < 712; y += 6){
    ctx.moveTo(px0, y); ctx.lineTo(px0+pw, y+3);
  }
  ctx.stroke();
  if (plunger.charging){
    // strefa skill shot na mierniku mocy
    ctx.fillStyle = "rgba(40,242,228,.45)";
    ctx.fillRect(465, 700 - SS_MAX*380, 8, (SS_MAX-SS_MIN)*380);
    ctx.fillStyle = "#FFC93C";
    ctx.shadowColor = "#FFC93C"; ctx.shadowBlur = 10;
    ctx.fillRect(466, 700 - compress*380, 6, compress*380);
    ctx.shadowBlur = 0;
  }

  // kulki-pszczoły ze smugą
  if (state === "play"){
    ballsList.forEach(b => {
      if (b.warp > 0) return;
      b.trail.push({x:b.x,y:b.y});
      if (b.trail.length > 9) b.trail.shift();
      b.trail.forEach((p,i) => {
        ctx.beginPath();
        ctx.arc(p.x,p.y, b.r*(i/b.trail.length)*.8, 0, 7);
        ctx.fillStyle = "rgba(255,201,60," + (0.07*i) + ")";
        ctx.fill();
      });
      drawBee(b.x, b.y, b.r, false);
    });
  }

  // PAJĄK na nici
  if (spider.phase !== "idle"){
    const jitter = spider.phase === "hold" ? Math.sin(T*40)*2 : 0;
    const sx = spider.x + jitter, sy = spider.y;
    ctx.strokeStyle = "rgba(185,174,232,.6)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(spider.x, -10); ctx.lineTo(spider.x, sy); ctx.stroke();
    // odnóża
    neonStroke("#7B5CFF", 2, 6);
    ctx.beginPath();
    for (let i = 0; i < 3; i++){
      const ly = sy + 2 + i*4, lx = 10 + i*4;
      ctx.moveTo(sx-4, sy); ctx.lineTo(sx-lx, ly+6);
      ctx.moveTo(sx+4, sy); ctx.lineTo(sx+lx, ly+6);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(sx, sy, 11, 0, 7);
    ctx.fillStyle = "#241D3D";
    ctx.strokeStyle = "#7B5CFF"; ctx.lineWidth = 2;
    ctx.shadowColor = "#7B5CFF"; ctx.shadowBlur = 10;
    ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#FF2E2E";
    ctx.fillRect(sx-5, sy-3, 3, 3);
    ctx.fillRect(sx+2, sy-3, 3, 3);
  }

  // iskry
  sparks.forEach(s => {
    ctx.globalAlpha = Math.max(0, s.life/0.55);
    ctx.fillStyle = s.c;
    ctx.fillRect(s.x-1.5, s.y-1.5, 3, 3);
  });
  ctx.globalAlpha = 1;

  // zaćmienie: mgła zakrywa planszę, widać tylko okolice kulek i flipperów
  if (debuffs.fog > 0){
    if (!fogCv){ fogCv = document.createElement("canvas"); fogCv.width = W; fogCv.height = H; }
    const fc = fogCv.getContext("2d");
    fc.clearRect(0,0,W,H);
    fc.fillStyle = "rgba(4,2,10,0.88)";
    fc.fillRect(0,0,W,H);
    fc.globalCompositeOperation = "destination-out";
    const holes = ballsList.filter(b => b.warp <= 0).map(b => [b.x, b.y, 85]);
    holes.push([222, 655, 120]);   // flippery zawsze widoczne
    holes.forEach(([hx,hy,hr]) => {
      const g = fc.createRadialGradient(hx,hy,hr*0.25, hx,hy,hr);
      g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)");
      fc.fillStyle = g;
      fc.beginPath(); fc.arc(hx,hy,hr,0,7); fc.fill();
    });
    fc.globalCompositeOperation = "source-over";
    ctx.globalAlpha = Math.min(1, debuffs.fog / 1.2);
    ctx.drawImage(fogCv, 0, 0);
    ctx.globalAlpha = 1;
  }

  // wyskakujące punkty
  popups.forEach(p => {
    ctx.globalAlpha = Math.max(0, 1 - p.t/0.9);
    text(p.txt, p.x, p.y - p.t*46, 13, "#EDE9FF", "center", 6);
  });
  ctx.globalAlpha = 1;

  // HUD w martwych rogach nad łukiem
  text("SCORE", 26, 30, 12, "#28F2E4", "left", 4);
  text(String(score).padStart(6,"0"), 26, 50, 18, "#EDE9FF", "left", 6);
  text("LVL " + level + "  ×" + level + (effects.fever>0 ? "×2" : ""), 26, 70, 12, "#FFC93C", "left", 4);
  text("HI " + String(Math.max(hi,score)).padStart(6,"0"), 454, 30, 12, "#FF3EA5", "right", 4);
  text("●".repeat(Math.min(8, Math.max(0,lives))), 454, 52, 14, "#FFC93C", "right", 6);
  text(music.on ? "♪ ON" : "♪ OFF", 454, 72, 10, music.on ? "#28F2E4" : "#6B6485", "right", 2);

  // aktywne efekty
  let ey = 92;
  const fx = [
    [effects.fever,  "FEVER ×2", "#FFC93C"],
    [effects.shield, "TARCZA",   "#28F2E4"],
    [effects.big,    "WIELKA",   "#FF3EA5"],
    [effects.slow,   "SLOW-MO",  "#7B5CFF"],
    [debuffs.short,  "✂ KRÓTKIE FLIPPERY", "#FF5A5A"],
    [debuffs.heavy,  "▼ CIĘŻKA GRAW.",     "#FF5A5A"],
    [debuffs.invert, "⇄ ODWRÓCONE!",       "#FF5A5A"],
    [debuffs.fog,    "☁ ZAĆMIENIE",        "#FF5A5A"],
  ];
  fx.forEach(([tv, label, c]) => {
    if (tv <= 0) return;
    text(label + " " + Math.ceil(tv) + "s", 26, ey, 10, c, "left", 3);
    ey += 16;
  });
  if (ballsList.length > 1)
    text("MULTIBALL ×" + ballsList.length, 26, ey, 10, "#FF6B35", "left", 3);

  // slow-mo: niebieskie zabarwienie
  if (effects.slow > 0){
    ctx.fillStyle = "rgba(123,92,255,.07)";
    ctx.fillRect(0,0,W,H);
  }

  // komunikaty na planszy
  for (let i = msgs.length-1; i >= 0; i--){
    const m = msgs[i];
    m.t += 1/60;
    if (m.t > m.dur){ msgs.splice(i,1); continue; }
    if (!m.text) continue;
    const a = Math.min(1, (m.dur - m.t) / 0.4, m.t / 0.15);
    ctx.globalAlpha = a;
    text(m.text, 240, 400 + i*26, 16, "#FFC93C", "center", 12);
    ctx.globalAlpha = 1;
  }

  // rozbłysk (level up, frenzy)
  if (flash > 0){
    ctx.fillStyle = "rgba(255,255,255," + (flash*0.5) + ")";
    ctx.fillRect(0,0,W,H);
  }

  // nakładki
  blink += 1/60;
  const show = Math.floor(blink*2) % 2 === 0;
  if (state === "title"){
    ctx.fillStyle = "rgba(6,4,16,.8)"; ctx.fillRect(0,0,W,H);
    drawBee(240, 165 + Math.sin(T*2.2)*8, 26, true);
    text("BZZZ", 240, 255, 62, "#FFC93C", "center", 24);
    text("BALL", 240, 322, 62, "#FF3EA5", "center", 24);
    text("RETRO PINBALL", 240, 376, 15, "#EDE9FF", "center", 6);
    text("← →  FLIPPERY   ·   SPACJA  WYRZUTNIA", 240, 434, 13, "#B9AEE8", "center", 0);
    text("ZBIJ TARGETY = POZIOM   ·   ZAPAL B-Z-Z-Z", 240, 458, 12, "#B9AEE8", "center", 0);
    text("ŁAP BONUSY: 1UP · MULTI · TV — UNIKAJ KLĄTW ✂▼⇄", 240, 482, 12, "#B9AEE8", "center", 0);
    text("PAJĄK · KRÓLOWA OS · SKILL SHOT · MIÓD", 240, 506, 12, "#B9AEE8", "center", 0);
    if (hi > 0) text("REKORD  " + hi, 240, 542, 13, "#FF3EA5", "center", 4);
    if (show) text("INSERT COIN — SPACJA / DOTYK", 240, 588, 16, "#FFC93C", "center", 10);
  } else if (state === "over"){
    ctx.fillStyle = "rgba(6,4,16,.8)"; ctx.fillRect(0,0,W,H);
    text("GAME OVER", 240, 260, 44, "#FF3EA5", "center", 20);
    text("WYNIK  " + score, 240, 330, 22, "#EDE9FF", "center", 8);
    text("POZIOM  " + level, 240, 368, 16, "#B9AEE8", "center", 4);
    if (newHi && show) text("★ NOWY REKORD ★", 240, 408, 18, "#FFC93C", "center", 12);
    else text("REKORD  " + hi, 240, 408, 16, "#B9AEE8", "center", 4);
    if (show) text("INSERT COIN — SPACJA / DOTYK", 240, 480, 16, "#FFC93C", "center", 10);
  } else if (ballOnPlunger() && show){
    text("PRZYTRZYMAJ SPACJĘ", 240, 600, 13, "#FFC93C", "center", 8);
  }
}

/* ---------- pętla ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  const SUB = 4, h = dt/SUB;
  for (let i=0;i<SUB;i++) step(h);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- sterowanie ---------- */
const L_KEYS = ["ArrowLeft","KeyA","KeyZ"], R_KEYS = ["ArrowRight","KeyD","Slash"];
function pressFlip(side, down){
  fin[side] += down ? 1 : -1;
  if (fin[side] < 0) fin[side] = 0;
  if (down){ spiderMash(); beep(90,.05,"triangle",.05); }
}
function toggleMusic(){
  music.on = !music.on;
  say(music.on ? "MUZYKA ON" : "MUZYKA OFF", 1);
}
function startIfIdle(){
  if (state === "title" || state === "over"){ newGame(); return true; }
  return false;
}
window.addEventListener("keydown", e => {
  audioOn();
  if (["ArrowLeft","ArrowRight","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === "KeyM"){ toggleMusic(); return; }
  if (state === "video"){
    if (["Space","Enter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyA","KeyD","KeyZ","Slash"].includes(e.code)) vmFlap();
    return;
  }
  if ((e.code === "Space" || e.code === "Enter") && startIfIdle()) return;
  if (L_KEYS.includes(e.code)) pressFlip("L", true);
  if (R_KEYS.includes(e.code)) pressFlip("R", true);
  if (e.code === "Space" || e.code === "ArrowDown") plunger.charging = true;
});
window.addEventListener("keyup", e => {
  if (L_KEYS.includes(e.code)) pressFlip("L", false);
  if (R_KEYS.includes(e.code)) pressFlip("R", false);
  if (e.code === "Space" || e.code === "ArrowDown") releasePlunger();
});
window.addEventListener("blur", () => {
  fin.L = 0; fin.R = 0;
  plunger.charging = false; plunger.power = 0;
});

// dotyk: strefa "♪" wycisza; kulka na wyrzutni — dotyk ładuje; inaczej połówki = flippery
const touchMap = {};
cv.addEventListener("touchstart", e => {
  e.preventDefault(); audioOn();
  const rect = cv.getBoundingClientRect();
  for (const t of e.changedTouches){
    const gx = (t.clientX - rect.left) / rect.width * W;
    const gy = (t.clientY - rect.top) / rect.height * H;
    if (gy < 85 && gx > 380){ toggleMusic(); continue; }
    if (state === "video"){ vmFlap(); continue; }
    if (startIfIdle()) continue;
    if (ballOnPlunger()){
      touchMap[t.identifier] = "P"; plunger.charging = true;
    } else {
      const side = gx < W/2 ? "L" : "R";
      touchMap[t.identifier] = side;
      pressFlip(side, true);
    }
  }
}, {passive:false});
function touchEnd(e){
  e.preventDefault();
  for (const t of e.changedTouches){
    const role = touchMap[t.identifier];
    delete touchMap[t.identifier];
    if (role === "L" || role === "R") pressFlip(role, false);
    else if (role === "P") releasePlunger();
  }
}
cv.addEventListener("touchend", touchEnd, {passive:false});
cv.addEventListener("touchcancel", touchEnd, {passive:false});
})();
</script>

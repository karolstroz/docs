<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BZZZball — Retro Pinball</title>
<style>
  :root{
    --bg-deep:#1C0919;
    --bg-glow:#3A1233;
    --ink:#FFEFD6;
    --gold:#F7B500;
    --red:#E23131;
    --teal:#14A3A6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, var(--bg-glow) 0%, var(--bg-deep) 70%);
    color:var(--ink);
    font-family:"Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:14px;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  h1{
    font-size:clamp(18px,3.4vw,30px);
    font-weight:700;letter-spacing:.45em;text-transform:uppercase;
    color:#FFD95E;
    text-shadow:0 0 6px var(--gold),0 0 18px rgba(247,181,0,.55),2px 2px 0 var(--red);
    text-indent:.45em; /* wyrównuje letter-spacing ostatniej litery */
  }
  /* rama automatu z kolorowymi żarówkami jak w klasycznym pinballu */
  .cabinet{
    position:relative;line-height:0;
    border-radius:18px;
    padding:26px;
    background:#200A1D;
    box-shadow:0 0 34px rgba(0,0,0,.8), inset 0 0 26px rgba(0,0,0,.75);
  }
  .cabinet::before{
    content:"";position:absolute;inset:4px;border-radius:15px;pointer-events:none;
    background-image:
      radial-gradient(circle 6px at 13px 13px, #FFE066 0 5px, rgba(255,224,102,.35) 6px, transparent 8px),
      radial-gradient(circle 6px at 13px 13px, #66E0FF 0 5px, rgba(102,224,255,.35) 6px, transparent 8px),
      radial-gradient(circle 6px at 13px 13px, #FF6BD5 0 5px, rgba(255,107,213,.35) 6px, transparent 8px),
      radial-gradient(circle 6px at 13px 13px, #8AFF66 0 5px, rgba(138,255,102,.35) 6px, transparent 8px);
    background-size:52px 52px, 52px 52px, 52px 52px, 52px 52px;
    background-position:0 0, 26px 26px, 0 26px, 26px 0;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite:exclude;
    padding:22px;
    animation:marquee 1.2s steps(2) infinite, hue 9s linear infinite;
  }
  @keyframes marquee{50%{background-position:26px 26px, 0 0}}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  canvas{
    display:block;border-radius:10px;
    width:min(88vw, calc((100dvh - 170px) * 2 / 3)) !important;
    aspect-ratio:2/3;height:auto !important;
    background:#2B0E26;
  }
  /* CRT: delikatne skanlinie + winieta */
  .cabinet::after{
    content:"";position:absolute;inset:26px;border-radius:10px;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.08) 0 1px, transparent 1px 3px),
      radial-gradient(115% 115% at 50% 45%, transparent 68%, rgba(0,0,0,.38) 100%);
  }
  .hint{
    font-size:clamp(10px,1.6vw,13px);
    letter-spacing:.12em;opacity:.75;text-align:center;line-height:1.7;
  }
  .hint b{color:var(--amber);font-weight:700}
  @media (prefers-reduced-motion: no-preference){
    h1{animation:hum 4s ease-in-out infinite}
    @keyframes hum{0%,100%{opacity:1}50%{opacity:.88}}
  }
</style>
</head>
<body>
<h1>BZZZball</h1>
<div class="cabinet"><canvas id="game" aria-label="BZZZball — pinball, gra zręcznościowa"></canvas></div>
<p class="hint">
  <b>←</b> / <b>→</b> flippery · <b>SPACJA</b> wyrzutnia · <b>S</b> magna-save · <b>SHIFT</b> tilt · <b>M</b> muzyka<br>
  tytuł: <b>2</b> dwóch graczy · <b>T</b> tryb dnia &nbsp;·&nbsp; dotyk: połówki ekranu = flippery, dół-środek = magna
</p>
<script src="pixi.min.js"></script>
<script>
(() => {
"use strict";
const W = 480, H = 720;
const G = 1500;              // grawitacja bazowa px/s^2
const MAXV = 1650;
const MAXLEVEL = 9;
const cv = document.getElementById("game");   // canvas przejmuje PIXI (sekcja "rysowanie")

/* ---------- dźwięk (WebAudio, generowany) ---------- */
let AC = null, noiseBuf = null;
function audioOn(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === "suspended") AC.resume();
}
function beep(freq, dur, type, vol, slide){
  if (!AC) return;
  note(freq, AC.currentTime, dur, type, vol, slide);
}
function note(freq, t, dur, type, vol, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol || 0.04, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
function melody(freqs, step, dur, type, vol){
  if (!AC) return;
  const t = AC.currentTime;
  freqs.forEach((f,i) => note(f, t + i*step, dur, type, vol));
}
function noiseHit(t, vol){
  if (!AC) return;
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  }
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf;
  f.type = "highpass"; f.frequency.value = 5000;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(f).connect(g).connect(AC.destination);
  s.start(t);
}

/* ---------- muzyka: syntezatorowy loop, tempo rośnie z poziomem i FEVER ---------- */
const music = { on: true, next: 0, step: 0 };
const BASS = [45,45,48,45,43,43,41,43];      // MIDI, A-moll
const ARP  = [69,72,76,79,81,79,76,72];
const mtof = m => 440 * Math.pow(2, (m-69)/12);
function musicTick(){
  const musical = state === "play" || state === "video" || state === "video2" || state === "hive";
  if (!AC || !music.on || !musical){ if (AC) music.next = AC.currentTime + 0.1; return; }
  const bpm = 104 + level*8 + (effects.fever > 0 ? 24 : 0) + (state.startsWith("video") ? 28 : 0);
  const spb = 30/bpm;                        // ósemka
  if (music.next < AC.currentTime) music.next = AC.currentTime + 0.05;
  while (music.next < AC.currentTime + 0.3){
    const t = music.next, s = music.step;
    const oct = (Math.floor(s/8) % 4 === 3) ? 2 : 1;   // co czwarty takt oktawa wyżej
    note(mtof(BASS[s%8]), t, spb*0.85, "sawtooth", 0.035);
    note(mtof(ARP[s%8]) * oct, t, spb*0.5, "square", 0.015);
    if (s%2 === 0) noiseHit(t, 0.012);
    if (s%8 === 7) noiseHit(t, 0.022);
    music.next += spb; music.step++;
  }
}
setInterval(musicTick, 80);
function jingle(){ melody([523,659,784,1047], 0.09, 0.14, "square", 0.05); }

/* ---------- stan gry ---------- */
let state = "title";         // title | play | over
let score = 0, lives = 3, level = 1;
let hi = +(localStorage.getItem("bzzzball-hi") || 0);
let newHi = false;
let shake = 0, blink = 0, T = 0, flash = 0;
let ballsList = [];
const plunger = { power: 0, charging: false };
const msgs = [];             // komunikaty na planszy
const popups = [];           // wyskakujące punkty
const sparks = [];           // iskry
let combo = 0, lastHit = -9;
let fogCv = null;
const effects = { fever: 0, shield: 0, big: 0, slow: 0 };
const debuffs = { short: 0, heavy: 0, invert: 0, fog: 0 };   // klątwy
const honey = { t: 0, x: 222, y: 300, r: 46 };               // rozlany miód
const fin = { L: 0, R: 0 };                                  // wciśnięcia flipperów (liczniki)

/* ---------- losowość + tryb dnia (wspólny seed dla wszystkich danego dnia) ---------- */
let rand = Math.random;
let daily = false;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dailySeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}

/* ---------- statystyki sesji ---------- */
let stats = null;
function resetStats(){
  stats = { maxCombo:0, tele:0, wasps:0, loops:0, time:0, pick:0, curse:0, magna:0, hive:0 };
}
resetStats();

/* ---------- komentator ---------- */
let recordAnnounced = false, comboAnnounced = false;
function announce(t){
  msgs.push({ text: t, t: 0, dur: 2.4, big: true });
  buzz(20);
}

/* ---------- TILT: szturchnięcie stołu (Shift / potrząśnięcie telefonem) ---------- */
const tilt = { count: 0, dead: false, lastT: -9 };
function doTilt(){
  if (state !== "play" || tilt.dead || T - tilt.lastT < 0.8) return;
  tilt.lastT = T;
  tilt.count++;
  ballsList.forEach(b => {
    if (!b.held && b.warp <= 0){ b.vx += (rand()-0.5)*340; b.vy -= 150; }
  });
  shake = 9; buzz(40); beep(80, .15, "square", .07);
  if (tilt.count >= 3){
    tilt.dead = true;
    announce("TILT!");
    say("FLIPPERY MARTWE DO KOŃCA KULKI", 2.6);
    fin.L = 0; fin.R = 0;
  } else say("TILT " + tilt.count + "/3", 1.2);
}
window.addEventListener("devicemotion", e => {
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  if (Math.abs(a.x||0) + Math.abs(a.y||0) > 28) doTilt();
});

/* ---------- MAGNA-SAVE (Black Knight): magnes ratujący kulkę znad rynny ---------- */
const magna = { charges: 1, t: 0 };
function magnaSave(){
  if (state !== "play" || magna.charges <= 0) return;
  const falling = ballsList.filter(b => !b.held && b.warp <= 0 && b.y > 520);
  if (!falling.length) return;
  magna.charges--;
  stats.magna++;
  falling.forEach(b => { b.vy = -720; b.vx += (222 - b.x) * 1.4; });
  magna.t = 0.5;
  announce("MAGNA-SAVE!");
  spawnSparks(222, 690, "#28F2E4", 22, 420);
  flash = Math.max(flash, 0.25);
  buzz([20,40,20]);
  beep(200, .3, "sawtooth", .07, 500);
}

/* ---------- zapadnia: płyta nad środkową rynną, czasem się otwiera ---------- */
const trap = { closed: true, t: 10 };

/* ---------- magistrala zdarzeń (misje) ---------- */
function evt(kind){
  if (!mission) return;
  if (mission.k === kind || (mission.k === "bump" && kind === "bumpL")){
    mission.got++;
    if (mission.got >= mission.need){
      addScore(1500);
      announce("MISJA WYKONANA!");
      popup(240, 380, "+" + 1500*level*(effects.fever>0?2:1));
      melody([659,784,988,1319], 0.07, 0.12, "square", 0.05);
      spawnPickup();
      mission = null; missionT = 20 + rand()*10;
    }
  }
}

/* ---------- misje (modes jak w prawdziwych flipperach) ---------- */
const MISSION_POOL = [
  { k:"bumpL",  desc:"TRAF LEWY BUMPER 3×",  need:3, t:20, min:1 },
  { k:"bump",   desc:"TRAF 6 BUMPERÓW",      need:6, t:25, min:1 },
  { k:"sling",  desc:"3× SLINGSHOT",         need:3, t:20, min:1 },
  { k:"tgt",    desc:"ZBIJ 4 TARGETY",       need:4, t:30, min:1 },
  { k:"tele",   desc:"2× TUNEL",             need:2, t:30, min:2 },
  { k:"loop",   desc:"ZRÓB PEŁNĄ ORBITĘ",    need:1, t:25, min:1 },
  { k:"flower", desc:"ZBIERZ 3 KWIATY",      need:3, t:30, min:1 },
];
let mission = null, missionT = 15;

/* ---------- mystery hole (Theatre of Magic): losowa nagroda albo pech ---------- */
const mystery = { x: 390, y: 340, r: 14, cool: 0, spin: 0 };
function applyMysteryResult(){
  const roll = rand();
  if (roll < 0.22){
    const hz = HAZARD_TYPES[Math.floor(rand()*HAZARD_TYPES.length)];
    say("PECH!", 1.2);
    applyHazard({ x: mystery.x, y: mystery.y, type: hz });
  } else if (roll < 0.5){
    addScore(1000);
    popup(mystery.x, mystery.y, "+" + 1000*level*(effects.fever>0?2:1));
    beep(660, .15, "square", .05);
  } else if (roll < 0.7){
    const t = PICKUP_TYPES[Math.floor(rand()*PICKUP_TYPES.length)];
    stats.pick++;
    applyPickup({ x: mystery.x, y: mystery.y, type: t }, null);
  } else if (roll < 0.85){
    magna.charges = Math.min(2, magna.charges + 1);
    say("MAGNA-SAVE +1", 1.6);
    beep(520, .15, "square", .05);
  } else {
    addScore(2500);
    announce("JACKPOT!");
    popup(mystery.x, mystery.y, "+" + 2500*level*(effects.fever>0?2:1));
    melody([784,988,1319,1568], 0.07, 0.12, "square", 0.05);
  }
}

/* ---------- pełne orbity wokół łuku ---------- */
const ORBIT = [ {x:50, y:245, r:26}, {x:394, y:245, r:26} ];   // złote słoneczka przy bandach
const orbitLast = { side: -1, t: -9 };
let loopChain = 0, lastLoopT = -9;

/* ---------- kwiaty i pyłek: napełnij słoik miodu ---------- */
let flowers = [], flowerT = 5, pollen = 0;
function collectFlower(fl, b){
  pollen++;
  addScore(100);
  spawnSparks(fl.x, fl.y, "#FF9BE8", 8, 200);
  popup(fl.x, fl.y, "PYŁEK " + pollen + "/5");
  evt("flower");
  beep(880 + pollen*80, .08, "sine", .05);
  if (pollen >= 5){
    pollen = 0;
    announce("SŁOIK MIODU PEŁNY!");
    const t = PICKUP_TYPES[Math.floor(rand()*PICKUP_TYPES.length)];
    stats.pick++;
    applyPickup({ x: b.x, y: b.y, type: t }, b);
  }
}

/* ---------- pory dnia: paleta zmienia się z poziomami ---------- */
const THEMES = [
  { name:"ŚWIT",   bg:"#0B0817", glow:"rgba(255,62,165,.12)",  wall:"#7B5CFF" },
  { name:"DZIEŃ",  bg:"#0A1020", glow:"rgba(64,160,255,.13)",  wall:"#4F8CFF" },
  { name:"ZACHÓD", bg:"#150A14", glow:"rgba(255,138,60,.13)",  wall:"#C86BFF" },
  { name:"NOC",    bg:"#050510", glow:"rgba(123,92,255,.09)",  wall:"#4436A8" },
];
function themeIdx(){ return level <= 2 ? 0 : level <= 4 ? 1 : level <= 6 ? 2 : 3; }

/* ---------- świetliki (tylko nocą, poziom 7+) ---------- */
let fireflies = [];
function spawnFireflies(){
  fireflies = Array.from({length:6}, () => ({
    x: 60 + rand()*360, y: 140 + rand()*320, ph: rand()*7,
  }));
}

/* ---------- rój os (poziom 4+): zbij wszystkie dla bonusu ---------- */
let wasps = [], waspT = 26, swarmSize = 0, swarmKills = 0;
function waspPos(w){
  return { x: w.ax + Math.sin(T*1.3 + w.ph)*38, y: w.ay + Math.sin(T*1.7 + w.ph2)*30 };
}
function spawnSwarm(){
  wasps = Array.from({length:5}, () => ({
    ax: 90 + rand()*300, ay: 150 + rand()*160,
    ph: rand()*7, ph2: rand()*7, t: 25,
  }));
  swarmSize = wasps.length; swarmKills = 0;
  say("RÓJ OS! ZBIJ WSZYSTKIE", 2.4);
  beep(300, .3, "sawtooth", .05, 120);
}

/* ---------- niedźwiedź (poziom 9): łapa kradnie miód (punkty!) ---------- */
const bear = { phase: "idle", t: 18, x: -95, hp: 3, hitCool: 0, stolen: 0 };
function bearPaw(){ return { x1: bear.x - 80, y: 470, x2: bear.x, r: 26 }; }
function collideBear(b){
  if (bear.x < -20) return;
  const p = bearPaw();
  const hit = collideCapsule(b, p.x1, p.y, p.x2, p.y, p.r, 0.8);
  if (hit && bear.hitCool <= 0 && hit.vn < -140){
    bear.hitCool = 0.4; bear.hp--;
    registerHit(bear.x - 30, 470, 500);
    spawnSparks(bear.x - 20, 470, "#C98A4B", 12);
    beep(120, .15, "sawtooth", .07, -40);
    buzz(25);
    if (bear.hp <= 0){
      bear.phase = "out";
      award("bear");
      announce("MIÓD URATOWANY!");
      addScore(3000);
      popup(bear.x - 30, 440, "+" + 3000*level*(effects.fever>0?2:1));
      melody([523,659,784,1047,1319], 0.07, 0.13, "square", 0.055);
      flash = 0.4; shake = 7;
    }
  }
}
function updBear(dt){
  if (level < 9) return;
  bear.hitCool = Math.max(0, bear.hitCool - dt);
  if (bear.phase === "idle"){
    bear.t -= dt;
    if (bear.t <= 0){
      bear.phase = "in"; bear.hp = 3; bear.stolen = 0;
      announce("NIEDŹWIEDŹ KRADNIE MIÓD!");
      buzz([60,50,60]);
    }
  } else if (bear.phase === "in"){
    bear.x += 130*dt;
    if (bear.x >= 150){ bear.x = 150; bear.phase = "stay"; bear.t = 6; }
  } else if (bear.phase === "stay"){
    bear.t -= dt;
    const steal = Math.min(score, 120*dt*level);
    bear.stolen += steal;
    score = Math.max(0, Math.round(score - steal));
    if (bear.t <= 0) bear.phase = "out";
  } else if (bear.phase === "out"){
    bear.x -= 170*dt;
    if (bear.x <= -95){ bear.x = -95; bear.phase = "idle"; bear.t = 20 + rand()*12; }
  }
}

function newBall(x,y,vx,vy){
  return { x, y, vx: vx||0, vy: vy||0, r: 9, trail: [], still: 0, warp: 0 };
}
function bR(){ return effects.big > 0 ? 15 : 9; }
function inLane(b){ return b.x > 424; }
function addScore(n){ score += n * level * (effects.fever > 0 ? 2 : 1); }
function say(text, dur){ msgs.push({ text, t: 0, dur: dur || 1.6 }); }
function popup(x, y, txt){
  popups.push({ x: Math.max(45, Math.min(435, x)), y, txt, t: 0 });
}
// wibracje (telefony z Androidem; iOS Safari nie wspiera navigator.vibrate)
function buzz(pattern){
  if (navigator.vibrate){ try { navigator.vibrate(pattern); } catch(e){} }
}
function spawnSparks(x, y, c, n, sp){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = (0.3+Math.random()*0.7)*(sp||260);
    sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 60, life: 0.55, c });
  }
}
function registerHit(x, y, base){
  combo = (T - lastHit < 1.8) ? combo + 1 : 1;
  lastHit = T;
  if (stats && combo > stats.maxCombo) stats.maxCombo = combo;
  if (combo === 10 && !comboAnnounced){ comboAnnounced = true; announce("PSZCZOŁA ROKU!"); }
  const pts = base * level * (effects.fever > 0 ? 2 : 1);
  score += pts;
  buzz(12);
  popup(x, y - 14, "+" + pts + (combo >= 3 ? " ×" + combo : ""));
  if (combo > 0 && combo % 8 === 0){
    effects.fever = Math.max(effects.fever, 8);
    say("BZZZ FRENZY!  PUNKTY ×2", 2.2);
    melody([440,554,659,880,1109], 0.07, 0.12, "sawtooth", 0.05);
    flash = Math.max(flash, 0.25);
  }
}
function gravScale(){
  return (1 + Math.min(0.4, 0.06*(level-1))) * (debuffs.heavy > 0 ? 1.5 : 1);
}

/* ---------- geometria stołu ---------- */
const segs = [];
function seg(x1,y1,x2,y2,o){
  o = o || {};
  const s = {x1,y1,x2,y2, rest:(o.rest!==undefined?o.rest:0.5),
             score:o.score||0, kick:o.kick||0, oneWay:!!o.oneWay,
             flash:0, draw:(o.draw!==false)};
  segs.push(s);
  return s;
}
// ściany boczne
seg(20,240,20,720);
seg(460,240,460,720);
// łuk górny (środek 240,240 R=220)
(function(){
  const cx=240, cy=240, R=220, N=26;
  for (let i=0;i<N;i++){
    const a1 = Math.PI + i*Math.PI/N, a2 = Math.PI + (i+1)*Math.PI/N;
    seg(cx+R*Math.cos(a1), cy+R*Math.sin(a1), cx+R*Math.cos(a2), cy+R*Math.sin(a2), {rest:.6});
  }
})();
// tor wyrzutni
seg(424,300,424,720);                          // ścianka toru
seg(426,652,460,652,{rest:.1,draw:false});     // podłoga toru (kulka na wyrzutni)
seg(424,300,458,264,{oneWay:true,rest:.4});    // bramka jednokierunkowa
// rynny prowadzące do flipperów (od poziomu 6 falują w rytm muzyki)
const funnelL = seg(20,505,142,640,{rest:.4});
const funnelR = seg(424,505,302,640,{rest:.4});
// slingshoty (przeciwprostokątna kopie i punktuje)
seg(130,528,172,598,{kick:330,score:50,rest:1});

const spider = { phase: "idle", timer: 20, y: -30, x: 0, hold: 0, mash: 0, ball: null };
function spiderMash(){
  if (spider.phase === "hold"){ spider.hold -= 0.22; spider.mash++; }
}
function spiderThrow(){
  const b = spider.ball;
  const a = -Math.PI/2 + (Math.random()-.5)*1.7;
  const v = 650 + Math.random()*350;
  b.held = false; b.vx = Math.cos(a)*v; b.vy = Math.sin(a)*v;
  if (spider.mash >= 6){
    addScore(300);
    popup(b.x, b.y-20, "UCIEKŁA! +" + 300*level*(effects.fever>0?2:1));
    achCount("_sp", 5, "spider5");
  }
  spawnSparks(b.x, b.y, "#B9AEE8", 10);
  beep(300, .2, "square", .06, 300); buzz(30);
  spider.phase = "up";
  spider.timer = 22 + Math.random()*14;
}
function updSpider(dt){
  if (spider.phase === "idle"){
    spider.timer -= dt;
    if (spider.timer <= 0){
      const prey = ballsList.find(b => !b.warp && !b.held && b.y > 150 && b.y < 480 && b.x > 60 && b.x < 380);
      if (prey){
        spider.phase = "drop"; spider.ball = prey; spider.y = -30; spider.x = prey.x;
        prey.held = true; prey.vx = 0; prey.vy = 0; prey.trail.length = 0;
        spider.mash = 0;
        say("PAJĄK ZŁAPAŁ PSZCZOŁĘ!  MASH ← →", 2.2);
        beep(160, .5, "sawtooth", .05, -100); buzz([40,60,40]);
      } else spider.timer = 3;
    }
  } else if (spider.phase === "drop"){
    spider.y += 600*dt; spider.x = spider.ball.x;
    if (spider.y >= spider.ball.y - 24){ spider.y = spider.ball.y - 24; spider.phase = "hold"; spider.hold = 1.6; }
  } else if (spider.phase === "hold"){
    spider.x = spider.ball.x;
    spider.hold -= dt;
    if (spider.hold <= 0) spiderThrow();
  } else if (spider.phase === "up"){
    spider.y -= 700*dt;
    if (spider.y < -30){ spider.phase = "idle"; spider.ball = null; }
  }
}

/* ---------- boss: KRÓLOWA OS — hołd dla Attack from Mars ---------- */
const queen = { alive: false, hp: 0, max: 0, hitCool: 0 };
function queenPos(){
  return { x: 222 + Math.sin(T*0.7)*120, y: 185 + Math.sin(T*1.13)*45 };
}
function collideQueen(b){
  const qp = queenPos();
  let nx = b.x-qp.x, ny = b.y-qp.y;
  const d = Math.hypot(nx,ny), rr = b.r + 19;
  if (d >= rr || d === 0) return;
  nx/=d; ny/=d;
  const vn = b.vx*nx + b.vy*ny;
  b.x = qp.x + nx*rr; b.y = qp.y + ny*rr;
  if (vn < 0){ b.vx -= 2*vn*nx; b.vy -= 2*vn*ny; b.vx += nx*120; b.vy += ny*120; }
  if (queen.hitCool <= 0 && vn < -140){
    queen.hitCool = 0.5; queen.hp--;
    registerHit(qp.x, qp.y, 300);
    spawnSparks(qp.x, qp.y, "#FF6B35", 10);
    beep(880, .08, "square", .06, -300);
    if (queen.hp <= 0){
      queen.alive = false;
      award("queen");
      addScore(2000);
      say("KRÓLOWA OS POKONANA!  +" + 2000*level*(effects.fever>0?2:1), 2.6);
      melody([392,523,659,784,1047,1319,1568], 0.07, 0.13, "square", 0.055);
      flash = 0.5; shake = 8;
      buzz([30,50,30,50,90]);
      spawnSparks(qp.x, qp.y, "#FF6B35", 40, 500);
      spawnPickup(qp.x, qp.y);
    }
  }
}

function viShoot(){

  vi.shots.push({ x: vi.x, y: 528 });
  vi.cool = 0.45;
  beep(900, .06, "square", .04, -400);

function stepInvaders(dt){
  if (vi.over > 0){
    vi.over -= dt;
    if (vi.over <= 0) endInvaders();
    return;
  }
  vi.t -= dt;
  if (vi.t <= 0){ vi.msg = "KONIEC CZASU"; vi.over = 1.2; return; }
  // ruch gracza flipperami
  if (fin.L > 0) vi.x -= 270*dt;
  if (fin.R > 0) vi.x += 270*dt;
  vi.x = Math.max(70, Math.min(410, vi.x));
  // auto-strzał
  vi.cool -= dt;
  if (vi.cool <= 0) viShoot();
  // osy maszerują
  let minx = 999, maxx = -999;
  vi.foes.forEach(f => { minx = Math.min(minx, f.x); maxx = Math.max(maxx, f.x); });
  const step = vi.dir * (44 + (18 - vi.t)) * dt;
  let drop = false;
  if (maxx + step > 424 || minx + step < 56){ vi.dir *= -1; drop = true; }
  vi.foes.forEach(f => { f.x += vi.dir*44*dt; if (drop) f.y += 16; });
  if (vi.foes.some(f => f.y > 500)){ vi.msg = "OSY WYGRAŁY!"; vi.over = 1.2; return; }
  // pociski
  for (let i = vi.shots.length-1; i >= 0; i--){
    const s = vi.shots[i];
    s.y -= 430*dt;
    if (s.y < 70){ vi.shots.splice(i,1); continue; }
    for (let j = vi.foes.length-1; j >= 0; j--){
      const f = vi.foes[j];
      if (Math.abs(s.x-f.x) < 18 && Math.abs(s.y-f.y) < 15){

        score += pts; vi.score += pts;
        beep(700 + Math.random()*300, .07, "square", .05, -250);
        break;
      }
    }
  }
  if (vi.foes.length === 0){
    const pts = 2000 * level * (effects.fever>0?2:1);
    score += pts; vi.score += pts;
    vi.msg = "RÓJ ZNISZCZONY!"; vi.over = 1.4;
    melody([523,659,784,1047,1319], 0.07, 0.12, "square", 0.055);
  }
}

      hv.pegs.push({ x: (r % 2 === 0 ? 90 : 120) + c*60, y: 170 + r*70 });
})();
const HV_SLOTS = [500, 1000, 2000, 1000, 500];
function startHive(b){

  hv.ball = b;
  hv.x = 220 + rand()*40; hv.y = 95; hv.vx = (rand()-0.5)*80; hv.vy = 0;

function endHive(){

  const b = hv.ball;
  b.x = 240; b.y = 84; b.vx = (rand()-0.5)*100; b.vy = 220;
  b.trail.length = 0;
  if (hv.bonus > 0) addScore(hv.bonus);

function stepHive(dt){
  if (hv.done > 0){
    hv.done -= dt;
    if (hv.done <= 0) endHive();
    return;
  }
  hv.t -= dt;
  hv.vy += 900*dt;
  hv.x += hv.vx*dt; hv.y += hv.vy*dt;
  // ściany komory
  if (hv.x < 66){ hv.x = 66; hv.vx = Math.abs(hv.vx)*0.6; }
  if (hv.x > 414){ hv.x = 414; hv.vx = -Math.abs(hv.vx)*0.6; }
  if (hv.y < 66){ hv.y = 66; hv.vy = Math.abs(hv.vy)*0.6; }
  // kołki
  hv.pegs.forEach(p => {
    let nx = hv.x-p.x, ny = hv.y-p.y;
    const d = Math.hypot(nx,ny), rr = 9 + 8;
    if (d >= rr || d === 0) return;
    nx/=d; ny/=d;
    hv.x = p.x + nx*rr; hv.y = p.y + ny*rr;
    const vn = hv.vx*nx + hv.vy*ny;
    if (vn < 0){
      hv.vx -= 1.55*vn*nx + (rand()-0.5)*40;
      hv.vy -= 1.55*vn*ny;
      beep(500 + Math.random()*200, .04, "triangle", .03);
    }
  });
  // lądowanie w komórce
  if (hv.y > 540 || hv.t <= 0){
    const idx = Math.max(0, Math.min(4, Math.floor((hv.x - 60) / 72)));
    hv.bonus = hv.t <= 0 && hv.y <= 540 ? 250 : HV_SLOTS[idx];
    hv.done = 1.4;
    spawnSparks(hv.x, Math.min(hv.y, 545), "#FFB020", 16, 300);
    beep(300, .3, "sine", .06, 400);
    buzz([20,30,20]);
  }
}
function hiveNudge(dir){

const SS_MIN = 0.6, SS_MAX = 0.78;

/* ---------- flippery ---------- */
function mkFlipper(px,py,dir){
  return {px,py,dir,len:62,r:10,rest:.55,active:-.7,ang:.55,vel:0,on:false};
}
const flippers = [ mkFlipper(146,645,1), mkFlipper(298,645,-1) ];
function effLen(f){ return f.len * (debuffs.short > 0 ? 0.62 : 1); }
function flipTip(f){
  const L = effLen(f);
  return { x: f.px + f.dir*Math.cos(f.ang)*L, y: f.py + Math.sin(f.ang)*L };
}
function updFlipper(f,dt){
  const target = f.on ? f.active : f.rest;
  const sp = f.on ? 17 : 11;
  const prev = f.ang;
  if (f.ang < target) f.ang = Math.min(target, f.ang + sp*dt);
  else if (f.ang > target) f.ang = Math.max(target, f.ang - sp*dt);
  f.vel = (f.ang - prev)/dt;
}

/* ---------- kolizje ---------- */
function collideSeg(b,s){
  if (s.oneWay && b.vy <= 0) return;
  const dx = s.x2-s.x1, dy = s.y2-s.y1;
  const L2 = dx*dx+dy*dy;
  let t = ((b.x-s.x1)*dx + (b.y-s.y1)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = s.x1+t*dx, cy = s.y1+t*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny);
  if (d >= b.r || d === 0) return;
  nx/=d; ny/=d;
  b.x = cx + nx*b.r; b.y = cy + ny*b.r;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+s.rest)*vn*nx;
    b.vy -= (1+s.rest)*vn*ny;
    // lekkie tarcie styczne, żeby kulka ładnie się toczyła
    const tx=-ny, ty=nx, vt=b.vx*tx+b.vy*ty;
    b.vx -= tx*vt*0.02; b.vy -= ty*vt*0.02;
    if (s.kick){
      b.vx += nx*s.kick; b.vy += ny*s.kick;
      s.flash = 1; shake = 3;
      beep(480+Math.random()*90, .08, "square", .055);
      spawnSparks(cx, cy, "#FF3EA5", 7);
      if (s.score){ registerHit(cx, cy, s.score); evt("sling"); }
    } else if (vn < -260){
      beep(120, .04, "triangle", .03);
    }
  }
}
function collideCircle(b,p,kick,scoreVal){
  let nx=b.x-p.x, ny=b.y-p.y;
  const d = Math.hypot(nx,ny), rr = b.r+p.r;
  if (d >= rr) return;
  nx/=(d||1); ny/=(d||1);
  b.x = p.x + nx*rr; b.y = p.y + ny*rr;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){ b.vx -= 2*vn*nx; b.vy -= 2*vn*ny; }
  if (kick){
    b.vx += nx*kick; b.vy += ny*kick;
    p.flash = 1; shake = 4;
    registerHit(p.x, p.y, scoreVal);
    spawnSparks(b.x, b.y, p.c || "#FFC93C", 9);
    beep(200+Math.random()*220, .09, "square", .06, -80);
    return true;
  }
}
// statyczna kapsuła (drop targety, lasery, tarcza); zwraca normalną albo null
function collideCapsule(b, x1,y1,x2,y2, rad, rest){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy || 1;
  let t = ((b.x-x1)*dx + (b.y-y1)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*dx, cy = y1+t*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny), rr = b.r+rad;
  if (d >= rr || d === 0) return null;
  nx/=d; ny/=d;
  b.x = cx + nx*rr; b.y = cy + ny*rr;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){ b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny; }
  return { nx, ny, vn };
}
// wirujący wiatrak: kapsuła obracająca się wokół środka, oddaje pęd obrotu
function collideRotor(b){
  const ang = rotorAng(), w = 2.0 + 0.15*level;
  const dx = Math.cos(ang)*rotor.len, dy = Math.sin(ang)*rotor.len;
  const x1 = rotor.x-dx, y1 = rotor.y-dy, x2 = rotor.x+dx, y2 = rotor.y+dy;
  const ddx = x2-x1, ddy = y2-y1, L2 = ddx*ddx+ddy*ddy;
  let t = ((b.x-x1)*ddx + (b.y-y1)*ddy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*ddx, cy = y1+t*ddy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny), rr = b.r+rotor.r;
  if (d >= rr || d === 0) return;
  nx/=d; ny/=d;
  b.x = cx + nx*rr; b.y = cy + ny*rr;
  const rx = cx-rotor.x, ry = cy-rotor.y;
  const vfx = -w*ry, vfy = w*rx;            // prędkość punktu styku ramienia
  const rvx = b.vx-vfx, rvy = b.vy-vfy;
  const vn = rvx*nx + rvy*ny;
  if (vn < 0){
    b.vx -= 1.8*vn*nx; b.vy -= 1.8*vn*ny;
    shake = 4;
    buzz(15);
    spawnSparks(cx, cy, "#FF6B35", 8);
    beep(150, .08, "sawtooth", .06, 250);
  }
}
function collideFlipper(b,f){
  const tip = flipTip(f);
  const dx = tip.x-f.px, dy = tip.y-f.py;
  const L2 = dx*dx+dy*dy;
  let t = ((b.x-f.px)*dx + (b.y-f.py)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = f.px+t*dx, cy = f.py+t*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx,ny), rr = b.r+f.r;
  if (d >= rr || d === 0) return;
  nx/=d; ny/=d;
  b.x = cx + nx*rr; b.y = cy + ny*rr;
  // prędkość punktu styku na flipperze (obrót wokół osi)
  const s = Math.sin(f.ang), c = Math.cos(f.ang);
  const vfx = (f.dir===1 ? -s : s) * effLen(f) * t * f.vel;
  const vfy = c * effLen(f) * t * f.vel;
  const rvx = b.vx - vfx, rvy = b.vy - vfy;
  const vn = rvx*nx + rvy*ny;
  if (vn < 0){
    const e = 0.4;
    b.vx -= (1+e)*vn*nx;
    b.vy -= (1+e)*vn*ny;
  }
}

function step(dt){
  T += dt;
  // odwrócona klątwa zamienia strony flipperów; TILT je zabija
  const inv = debuffs.invert > 0;
  flippers[0].on = !tilt.dead && (inv ? fin.R : fin.L) > 0;
  flippers[1].on = !tilt.dead && (inv ? fin.L : fin.R) > 0;
  flippers.forEach(f => updFlipper(f, dt));
  segs.forEach(s => { if (s.flash>0) s.flash = Math.max(0, s.flash - dt*3.5); });
  bumpers.forEach(p => { if (p.flash>0) p.flash = Math.max(0, p.flash - dt*3.5); });
  targets.forEach(tg => { if (tg.flash>0) tg.flash = Math.max(0, tg.flash - dt*3.5); });
  if (flash > 0) flash = Math.max(0, flash - dt*1.6);
  for (let i = sparks.length-1; i >= 0; i--){
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0){ sparks.splice(i,1); continue; }
    s.vy += 700*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
  }
  if (state === "video"){ stepVideo(dt); return; }
  if (state === "video2"){ stepInvaders(dt); return; }
  if (state === "hive"){ stepHive(dt); return; }
  if (state !== "play") return;
  if (hiveHole.cool > 0) hiveHole.cool -= dt;

  for (const k in effects) if (effects[k] > 0) effects[k] = Math.max(0, effects[k] - dt);
  for (const k in debuffs) if (debuffs[k] > 0) debuffs[k] = Math.max(0, debuffs[k] - dt);
  if (honey.t > 0) honey.t = Math.max(0, honey.t - dt);

  // bumper centralny ucieka od poziomu 7
  bumpers[2].x = level >= 7 ? 240 + Math.sin(T*1.1)*58 : 240;

  // pojawianie się bonusów
  pickupTimer -= dt;
  if (pickupTimer <= 0){
    spawnPickup();
    pickupTimer = 9 + Math.random()*4;
  }
  if (level >= 2){
    hazTimer -= dt;
    if (hazTimer <= 0){
      spawnHazard();
      hazTimer = Math.max(7, 15 - level) + Math.random()*4;   // im wyżej, tym częściej
    }
  }
  for (let i = pickups.length-1; i >= 0; i--){
    pickups[i].t += dt;
    if (pickups[i].t > pickups[i].life) pickups.splice(i,1);
  }

  stats.time += dt;
  if (magna.t > 0) magna.t -= dt;
  if (!recordAnnounced && hi > 0 && score > hi){ recordAnnounced = true; announce("NOWY REKORD!"); }
  if (score >= 100000) award("honey100k");

  // zapadnia: otwiera się z ostrzeżeniem, potem zamyka na dłużej
  trap.t -= dt;
  if (trap.t <= 0){
    if (trap.closed){
      trap.closed = false; trap.t = 2.5;
      beep(700, .12, "square", .05); beep(500, .12, "square", .05);
      say("ZAPADNIA OTWARTA!", 1.4);
    } else {
      trap.closed = true; trap.t = 9 + rand()*6;
    }
  }

  // ruchome ściany rynien (poziom 6+), falują w rytm muzyki
  if (level >= 6){
    const beat = (104 + level*8) / 60;
    const off = Math.sin(T * Math.PI * beat) * 12;
    funnelL.x2 = 142 + off;
    funnelR.x2 = 302 - off;
  } else { funnelL.x2 = 142; funnelR.x2 = 302; }

  // misje
  if (!mission){
    missionT -= dt;
    if (missionT <= 0){
      const pool = MISSION_POOL.filter(m => level >= m.min);
      const pick = pool[Math.floor(rand()*pool.length)];
      mission = { k: pick.k, desc: pick.desc, need: pick.need, got: 0, t: pick.t };
      say("MISJA: " + pick.desc, 2.4);
      beep(520, .1, "square", .05); beep(660, .1, "square", .05);
    }
  } else {
    mission.t -= dt;
    if (mission.t <= 0){
      say("MISJA NIEUDANA", 1.6);
      beep(220, .3, "sawtooth", .05, -120);
      mission = null; missionT = 22 + rand()*10;
    }
  }

  // mystery hole: ruletka po wpadnięciu
  if (mystery.cool > 0) mystery.cool -= dt;
  if (mystery.spin > 0){
    mystery.spin -= dt;
    if (mystery.spin <= 0) applyMysteryResult();
  }

  // kwiaty
  flowerT -= dt;
  if (flowerT <= 0){
    if (flowers.length < 3){
      const slot = PICKUP_SLOTS[Math.floor(rand()*PICKUP_SLOTS.length)];
      if (!flowers.some(f => Math.abs(f.x-slot[0]) < 8 && Math.abs(f.y-slot[1]) < 8))
        flowers.push({ x: slot[0], y: slot[1] + 30, ph: rand()*7 });
    }
    flowerT = 6 + rand()*4;
  }

  // łańcuch orbit wygasa
  if (loopChain > 0 && T - lastLoopT > 7) loopChain = 0;

  // rój os
  if (level >= 4){
    if (wasps.length === 0){
      waspT -= dt;
      if (waspT <= 0){ spawnSwarm(); waspT = 30 + rand()*10; }
    } else {
      wasps.forEach(w => w.t -= dt);
      const before = wasps.length;
      wasps = wasps.filter(w => w.t > 0);
      if (wasps.length === 0 && before > 0){
        say("OSY ODLECIAŁY...", 1.6);
        swarmSize = 0;
      }
    }
  }

  // niedźwiedź
  updBear(dt);

  // świetliki nocą
  if (themeIdx() === 3 && fireflies.length === 0) spawnFireflies();
  if (themeIdx() !== 3) fireflies.length = 0;

  MEDALS.forEach(m => { if (m.cool > 0) m.cool -= dt; });

  if (plunger.charging && ballOnPlunger()) plunger.power = Math.min(1, plunger.power + dt*1.15);
  if (portal.cool > 0) portal.cool -= dt;
  if (portal.blink > 0) portal.blink -= dt;
  if (portalActive()){
    portal.moveT -= dt;
    // wylot nie przeskakuje, gdy ktoś właśnie leci tunelem
    if (portal.moveT <= 0 && !ballsList.some(b => b.warp > 0)) relocatePortalOut();
  }
  if (queen.hitCool > 0) queen.hitCool -= dt;
  updSpider(dt);

  const dtb = dt * (effects.slow > 0 ? 0.55 : 1);   // slow-mo działa na kulki

  for (const b of ballsList){
    b.r = bR();

    // podróż tunelem: kulka znika, po chwili wypada z drugiego końca
    if (b.warp > 0){
      b.warp -= dtb;
      if (b.warp <= 0){
        b.x = portal.out.x; b.y = portal.out.y;
        b.vx = (222 - portal.out.x) * 0.5;   // zawsze w stronę środka planszy
        b.vy = 260;
        b.trail.length = 0;
        beep(880, .18, "sine", .06, -400);
        if (Math.random() < 0.6) relocatePortalOut();
      }
      continue;
    }

    if (b.held) continue;   // kulka w łapach pająka

    b.vy += G * gravScale() * dtb;

    // wir magnetyczny ciągnie w stronę rynny
    if (vortexActive()){
      const dx = vortex.x-b.x, dy = vortex.y-b.y;
      const d = Math.hypot(dx,dy);
      if (d < vortex.R && d > 5){
        const f = vortex.F * (1 - d/vortex.R);
        b.vx += dx/d * f * dtb;
        b.vy += dy/d * f * dtb;
      }
    }

    b.x += b.vx*dtb;
    b.y += b.vy*dtb;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > MAXV){ b.vx *= MAXV/sp; b.vy *= MAXV/sp; }

    // lepki miód mocno wyhamowuje
    if (honey.t > 0 && Math.hypot(b.x-honey.x, b.y-honey.y) < honey.r){
      const m = Math.max(0, 1 - 6*dtb);
      b.vx *= m; b.vy *= m;
      const hs = Math.hypot(b.vx, b.vy);
      if (hs > 330){ b.vx *= 330/hs; b.vy *= 330/hs; }
    }

    segs.forEach(s => collideSeg(b, s));
    RAILS_RED.forEach(r => {
      const hit = collideCapsule(b, r[0], r[1], r[2], r[3], 8, 0.6);
      if (hit && hit.vn < -240) beep(140, .04, "triangle", .03);
    });
    PODS_BLUE.forEach(p => collideCapsule(b, p[0], p[1], p[2], p[3], 11, 0.8));

    // medaliony punktowe: podświetlony daje ×10
    MEDALS.forEach((m, mi) => {
      if (m.cool > 0) return;
      if (Math.hypot(b.x-m.x, b.y-m.y) < 15 + b.r){
        m.cool = 1.2;
        const lit = medalLit() === mi;
        const base = m.v * (lit ? 10 : 1);
        addScore(base);
        popup(m.x, m.y, "+" + base*level*(effects.fever>0?2:1) + (lit ? " LIT!" : ""));
        spawnSparks(m.x, m.y, "#F7B500", lit ? 12 : 5, 220);
        beep(lit ? 1100 : 700, .08, "square", .05);
      }
    });

    if (trap.closed){
      const hit = collideCapsule(b, 186, 688, 258, 688, 5, 0.45);
      if (hit && hit.vn < -180) beep(150, .05, "triangle", .04);
    }
    if (effects.shield > 0){
      const hit = collideCapsule(b, 150, 690, 294, 690, 6, 1.1);
      if (hit){ spawnSparks(b.x, b.y+10, "#28F2E4", 8); beep(240, .1, "sine", .06, 200); }
    }
    bumpers.forEach((p,i) => {
      if (collideCircle(b, p, 300, p.score)) evt(i === 0 ? "bumpL" : "bump");
    });
    posts.forEach(p => collideCircle(b, p, 0, 0));
    flippers.forEach(f => collideFlipper(b, f));
    if (rotorActive()) collideRotor(b);
    if (queen.alive) collideQueen(b);
    if (level >= 9) collideBear(b);

    // rój os: dotknięcie osy = zbicie
    for (let i = wasps.length-1; i >= 0; i--){
      const wp = waspPos(wasps[i]);
      if (Math.hypot(b.x-wp.x, b.y-wp.y) < 8 + b.r){
        wasps.splice(i,1);
        stats.wasps++; swarmKills++;
        registerHit(wp.x, wp.y, 150);
        spawnSparks(wp.x, wp.y, "#FF6B35", 8);
        beep(1000, .07, "square", .05, -300);
        if (wasps.length === 0 && swarmKills === swarmSize){
          addScore(1000);
          announce("RÓJ ROZBITY!");
          spawnPickup(wp.x, wp.y);
        }
      }
    }

    // drop targety
    targets.forEach(tg => {
      if (tg.dead) return;
      const [tx1, ty1, tx2, ty2] = targetEnds(tg);
      const hit = collideCapsule(b, tx1, ty1, tx2, ty2, tg.r, 0.7);
      if (hit){
        tg.dead = true;
        registerHit(tg.x, tg.y, 250);
        evt("tgt");
        spawnSparks(tg.x, tg.y, "#FFC93C", 10);
        shake = 3;
        beep(1200, .1, "square", .05, -500);
      }
    });

    // lasery odbijają kulkę
    for (let i = 0; i < laserCount(); i++){
      const lx = laserX(i), ly = LASERS[i].y;
      const hit = collideCapsule(b, lx-LASER_HALF, ly, lx+LASER_HALF, ly, LASER_R, 0.6);
      if (hit){
        b.vx += hit.nx*230; b.vy += hit.ny*230;
        shake = 4;
        buzz(15);
        spawnSparks(b.x, b.y, "#FF2E2E", 8);
        beep(60, .12, "sawtooth", .07, 900);
      }
    }

    // rollovery B-Z-Z-Z (sensory, nie odbijają)
    letters.forEach((L,i) => {
      if (L.lit) return;
      if (Math.hypot(b.x-L.x, b.y-L.y) < 13 + b.r){
        L.lit = true;
        addScore(50);
        popup(L.x, L.y, L.ch + "!");
        spawnSparks(L.x, L.y, "#28F2E4", 6);
        beep(600 + i*140, .1, "square", .05);
        if (letters.every(l => l.lit)){
          addScore(1000);
          if (magna.charges < 2){ magna.charges++; say("MAGNA-SAVE +1", 1.6); }
          say("B-Z-Z-Z!  +" + 1000*level*(effects.fever>0?2:1) + "  BONUS!", 2.4);
          melody([784,988,1175,1568], 0.08, 0.14, "square", 0.055);
          spawnPickup(222, 300);
          flash = Math.max(flash, 0.3);
          resetLetters();
        }
      }
    });

    // łapanie bonusów
    for (let i = pickups.length-1; i >= 0; i--){
      const p = pickups[i];
      if (Math.hypot(b.x-p.x, b.y-p.y) < 13 + b.r){
        pickups.splice(i,1);
        if (p.bad){ stats.curse++; applyHazard(p); }
        else { stats.pick++; applyPickup(p, b); }
      }
    }

    // mystery hole
    if (mystery.cool <= 0 && Math.hypot(b.x-mystery.x, b.y-mystery.y) < mystery.r + b.r){
      mystery.cool = 8; mystery.spin = 1.4;
      b.vx = -260; b.vy = -340;
      spawnSparks(mystery.x, mystery.y, "#FFC93C", 12, 280);
      beep(400, .3, "sine", .06, 500);
      buzz(20);
    }

    // orbity: sensor lewy/prawy pod łukiem
    ORBIT.forEach((o, side) => {
      if (Math.hypot(b.x-o.x, b.y-o.y) >= o.r) return;
      if (orbitLast.side === 1 - side && T - orbitLast.t < 2.4){
        loopChain++; lastLoopT = T;
        stats.loops++;
        registerHit(240, 120, 750 * loopChain);
        popup(240, 140, "ORBITA ×" + loopChain);
        if (loopChain >= 2) announce("ORBITA SZALEŃSTWA!");
        if (loopChain >= 3) award("loop3");
        evt("loop");
        spawnSparks(240, 90, "#28F2E4", 14, 320);
        orbitLast.side = side; orbitLast.t = T;
      } else if (orbitLast.side !== side){
        orbitLast.side = side; orbitLast.t = T;
      }
    });

    // kwiaty
    for (let i = flowers.length-1; i >= 0; i--){
      const fl = flowers[i];
      if (Math.hypot(b.x-fl.x, b.y-fl.y) < 12 + b.r){
        flowers.splice(i,1);
        collectFlower(fl, b);
      }
    }

    // świetliki
    for (let i = fireflies.length-1; i >= 0; i--){
      const ff = fireflies[i];
      if (Math.hypot(b.x-ff.x, b.y-ff.y) < 10 + b.r){
        addScore(100);
        popup(ff.x, ff.y, "+" + 100*level*(effects.fever>0?2:1));
        spawnSparks(ff.x, ff.y, "#B8FF5A", 6, 180);
        beep(1400, .08, "sine", .04);
        fireflies[i] = { x: 60 + rand()*360, y: 140 + rand()*320, ph: rand()*7 };
      }
    }

    // wejście do ula
    if (hiveHole.cool <= 0 && Math.hypot(b.x-hiveHole.x, b.y-hiveHole.y) < hiveHole.r + b.r){
      hiveHole.cool = 25;
      startHive(b);
      return;
    }

    // wejście do tunelu
    if (portalActive() && portal.cool <= 0){
      const d = Math.hypot(b.x-portal.in.x, b.y-portal.in.y);
      if (d < portal.in.r + b.r){
        b.warp = 0.45; portal.cool = 1.6;
        stats.tele++; evt("tele");
        addScore(500);
        say("TUNEL! +" + 500*level*(effects.fever>0?2:1), 1.4);
        spawnSparks(portal.in.x, portal.in.y, "#28F2E4", 12, 300);
        beep(300, .4, "sine", .07, 900);
      }
    }

    // anty-zakleszczenie: kulka nieruchoma poza wyrzutnią dostaje kuksańca
    if (!inLane(b) && Math.hypot(b.vx, b.vy) < 12){
      b.still += dt;
      if (b.still > 3){
        b.vy -= 260;
        b.vx += (b.x < 222 ? 1 : -1) * (80 + Math.random()*80);
        b.still = 0;
        shake = 5;
        beep(70, .12, "triangle", .06);
      }
    } else {
      b.still = 0;
    }
  }

  // spadek do rynny
  const before = ballsList.length;
  ballsList = ballsList.filter(b => b.y <= H + 40);
  if (ballsList.length < before && ballsList.length > 0)
    say(ballsList.length === 1 ? "OSTATNIA KULKA!" : "", 1.2);
  if (ballsList.length === 0) loseLife();

  // wszystkie targety zbite -> nowy poziom
  if (targets.length && targets.every(tg => tg.dead)) levelUp();

  // aktualizacja popupów
  for (let i = popups.length-1; i >= 0; i--){
    popups[i].t += dt;
    if (popups[i].t > 0.9) popups.splice(i,1);
  }
}

const COL = {

  magenta:"#E84FD9", gold:"#F7B500", goldHi:"#FFE066", ink:"#4A2410",

  orange:"#FF8A00",
};

const app = new PIXI.Application({

cv.style.width = ""; cv.style.height = "";   // wracamy do responsywnego CSS

/* -- tekstura pola gry: żółty gradient, promienie, łuk, tor START, dekory -- */
function buildFieldTexture(){
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  // maska pola: łuk + prostokąt
  const field = () => {
    x.beginPath();
    x.moveTo(20, 240);
    x.arc(240, 240, 220, Math.PI, 0);
    x.lineTo(460, 720); x.lineTo(20, 720);
    x.closePath();
  };
  x.fillStyle = COL.outside;
  x.fillRect(0, 0, W, H);
  field();
  const g = x.createLinearGradient(0, 20, 0, 720);
  g.addColorStop(0, COL.field);
  g.addColorStop(1, COL.fieldLo);
  x.fillStyle = g;
  x.fill();
  // promienie słoneczne od dołu
  x.save();
  field(); x.clip();
  x.fillStyle = "rgba(255,226,122,.5)";
  for (let i = 0; i < 12; i++){
    const a1 = Math.PI + (i*2)*Math.PI/24, a2 = Math.PI + (i*2+1)*Math.PI/24;
    x.beginPath();
    x.moveTo(240, 760);
    x.arc(240, 760, 900, a1, a2);
    x.closePath(); x.fill();
  }
  // wielka turkusowa tarcza z gwiazdą w centrum (jak w klasyku)
  const disc = (cx,cy,r,fill) => { x.beginPath(); x.arc(cx,cy,r,0,7); x.fillStyle=fill; x.fill(); };
  disc(240, 452, 62, "#0E8C90");
  x.save(); x.translate(240, 452);
  x.fillStyle = "#14A3A6";
  for (let i = 0; i < 16; i++){
    x.rotate(Math.PI/8);
    x.beginPath(); x.moveTo(0,0); x.lineTo(56,-10); x.lineTo(56,10); x.closePath(); x.fill();
  }
  x.restore();
  disc(240, 452, 40, "#F2F6F7");
  disc(240, 452, 34, "#E8F4F5");
  x.save(); x.translate(240, 452); x.fillStyle = "#2E7BD6";
  x.beginPath();
  for (let i = 0; i < 5; i++){
    const a = -Math.PI/2 + i*2*Math.PI/5;
    const b = a + Math.PI/5;
    x.lineTo(Math.cos(a)*26, Math.sin(a)*26);
    x.lineTo(Math.cos(b)*11, Math.sin(b)*11);
  }
  x.closePath(); x.fill();
  x.restore();
  // białe kulki po bokach tarczy
  [[172,486],[308,486]].forEach(([bx,by]) => {
    const bg2 = x.createRadialGradient(bx-3,by-3,1, bx,by,11);
    bg2.addColorStop(0,"#FFFFFF"); bg2.addColorStop(1,"#C9CFD9");
    x.beginPath(); x.arc(bx,by,11,0,7); x.fillStyle = bg2; x.fill();
  });
  // pomarańczowe strzałki przy tarczy
  [[196,510,-1],[284,510,1]].forEach(([ax,ay,dir]) => {
    x.save(); x.translate(ax,ay); x.rotate(dir*Math.PI/4);
    x.fillStyle = "#FF8A00"; x.strokeStyle = "#FFFFFF"; x.lineWidth = 3;
    x.beginPath();
    x.moveTo(0,-26); x.lineTo(14,-4); x.lineTo(6,-4); x.lineTo(6,18);
    x.lineTo(-6,18); x.lineTo(-6,-4); x.lineTo(-14,-4);
    x.closePath(); x.fill(); x.stroke();
    x.restore();
  });
  // żółte i pomarańczowe kropki
  [[222,548,7,"#FFD400"],[258,548,7,"#FFD400"],[214,598,8,"#FF8A00"],[266,598,8,"#FF8A00"]].forEach(([dx,dy,dr,dc]) => {
    x.beginPath(); x.arc(dx,dy,dr,0,7);
    x.fillStyle = dc; x.fill();
    x.beginPath(); x.arc(dx-dr*0.3, dy-dr*0.3, dr*0.35, 0, 7);
    x.fillStyle = "rgba(255,255,255,.6)"; x.fill();
  });
  // czerwone mini-kapsuły przy rogach rynny
  [[100,668,140,696],[344,668,304,696]].forEach(([x1,y1,x2,y2]) => {
    x.lineCap = "round";
    x.lineWidth = 16; x.strokeStyle = "#FFFFFF";
    x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();
    x.lineWidth = 12; x.strokeStyle = "#E23131";
    x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();
    x.beginPath(); x.arc(x1,y1,2.5,0,7); x.fillStyle = "#D9DDE6"; x.fill();
    x.beginPath(); x.arc(x2,y2,2.5,0,7); x.fillStyle = "#D9DDE6"; x.fill();
  });
  // kolorowe trójkąciki przy bandach
  const tri = (tx,ty,s,col,rot) => {
    x.save(); x.translate(tx,ty); x.rotate(rot||0);
    x.beginPath(); x.moveTo(0,-s); x.lineTo(s,s); x.lineTo(-s,s); x.closePath();
    x.fillStyle = col; x.fill(); x.restore();
  };
  const triCols = ["#E23131","#2E7BD6","#14A3A6"];
  for (let i = 0; i < 7; i++){
    tri(38, 300 + i*58, 6, triCols[i%3], Math.PI/2);
    tri(406, 300 + i*58, 6, triCols[(i+1)%3], -Math.PI/2);
  }
  x.restore();
  // ciemny tor wyrzutni + napis START
  x.fillStyle = "rgba(43,14,38,.28)";
  x.fillRect(426, 300, 32, 420);
  x.save();
  x.translate(452, 560); x.rotate(-Math.PI/2);
  x.font = "700 20px 'Courier New', monospace";
  x.textAlign = "center";
  x.fillStyle = "#37E0DE";
  x.shadowColor = "#37E0DE"; x.shadowBlur = 8;
  x.fillText("START »", 0, 0);
  x.restore();
  // srebrne szyny: łuk + ściany + tor
  const rail = (w, col) => {
    x.lineWidth = w; x.strokeStyle = col; x.lineCap = "round";
    x.beginPath();
    x.moveTo(20, 720); x.lineTo(20, 240);
    x.arc(240, 240, 220, Math.PI, 0);
    x.lineTo(460, 720);
    x.stroke();
    x.beginPath(); x.moveTo(424, 300); x.lineTo(424, 720); x.stroke();
  };
  rail(9, COL.railLo);
  rail(6, COL.rail);
  rail(2, COL.railHi);
  return PIXI.Texture.from(c);
}

/* -- tekstura chromowanej kulki -- */
function buildBallTexture(){
  const c = document.createElement("canvas");
  c.width = 64; c.height = 64;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(24, 22, 4, 32, 32, 30);
  g.addColorStop(0, "#FFFFFF");
  g.addColorStop(0.35, "#D9DEE8");
  g.addColorStop(0.75, "#9AA3B5");
  g.addColorStop(1, "#5E6675");
  x.beginPath(); x.arc(32, 32, 30, 0, 7);
  x.fillStyle = g; x.fill();
  x.beginPath(); x.arc(23, 20, 6, 0, 7);
  x.fillStyle = "rgba(255,255,255,.9)"; x.fill();
  return PIXI.Texture.from(c);
}

/* -- pula sprite'ów kulek -- */
const ballSprites = [];
function ballSprite(i){
  let s = ballSprites[i];
  if (!s){
    s = new PIXI.Sprite(ballTex);
    s.anchor.set(0.5);
    ballLayer.addChild(s);
    ballSprites.push(s);
  }
  s.visible = true;
  return s;
}

/* -- pula tekstów -- */
const textPool = [];
let textIdx = 0, gAlpha = 1;
function text(str, x, y, size, color, align, glow){
  let t = textPool[textIdx++];
  if (!t){
    t = new PIXI.Text("", new PIXI.TextStyle({ fontFamily: "'Courier New', monospace", fontWeight: "700" }));
    txtLayer.addChild(t);
    textPool.push(t);
  }
  t.visible = true;
  t.text = str;
  const st = t.style;
  st.fontSize = size;
  st.fill = color;
  if (glow && glow > 2){
    st.dropShadow = true;
    st.dropShadowDistance = 0;
    st.dropShadowBlur = Math.min(12, glow);
    st.dropShadowColor = color;
    st.dropShadowAlpha = 0.85;
  } else {
    st.dropShadow = false;
  }
  t.anchor.set(align === "center" ? 0.5 : align === "right" ? 1 : 0, 0.5);
  t.position.set(x, y);
  t.alpha = gAlpha;
  return t;
}
function endTexts(){
  for (let i = textIdx; i < textPool.length; i++) textPool[i].visible = false;
  textIdx = 0;
}

/* -- adapter rysowania na gfx -- */
function ga(a){ gAlpha = a; }
function ln(x1,y1,x2,y2,w,col,alpha){
  gfx.lineStyle(w, C(col), (alpha ?? 1) * gAlpha);
  gfx.moveTo(x1,y1); gfx.lineTo(x2,y2);
  gfx.lineStyle();
}
function glowLn(x1,y1,x2,y2,w,col,glow){
  ln(x1,y1,x2,y2,w + glow, col, 0.22);
  ln(x1,y1,x2,y2,w,col,1);
}
function cir(x,y,r,fill,fa,stroke,sw,sa){
  if (stroke) gfx.lineStyle(sw||2, C(stroke), (sa ?? 1)*gAlpha);
  if (fill != null) gfx.beginFill(C(fill), (fa ?? 1)*gAlpha);
  gfx.drawCircle(x,y,r);
  if (fill != null) gfx.endFill();
  gfx.lineStyle();
}
function rect(x,y,w,h,fill,fa,stroke,sw){
  if (stroke) gfx.lineStyle(sw||2, C(stroke), gAlpha);
  if (fill != null) gfx.beginFill(C(fill), (fa ?? 1)*gAlpha);
  gfx.drawRect(x,y,w,h);
  if (fill != null) gfx.endFill();
  gfx.lineStyle();
}
function rrect(x,y,w,h,r,fill,fa,stroke,sw){
  if (stroke) gfx.lineStyle(sw||2, C(stroke), gAlpha);
  if (fill != null) gfx.beginFill(C(fill), (fa ?? 1)*gAlpha);
  gfx.drawRoundedRect(x,y,w,h,r);
  if (fill != null) gfx.endFill();
  gfx.lineStyle();
}
function poly(pts,fill,fa,stroke,sw,sa){
  if (stroke) gfx.lineStyle(sw||2, C(stroke), (sa ?? 1)*gAlpha);
  if (fill != null) gfx.beginFill(C(fill), (fa ?? 1)*gAlpha);
  gfx.drawPolygon(pts);
  if (fill != null) gfx.endFill();
  gfx.lineStyle();
}
function arc(x,y,r,a1,a2,w,col,alpha){
  gfx.lineStyle(w, C(col), (alpha ?? 1)*gAlpha);
  gfx.moveTo(x + Math.cos(a1)*r, y + Math.sin(a1)*r);
  gfx.arc(x,y,r,a1,a2);
  gfx.lineStyle();
}
function dashLine(x1,y1,x2,y2,dash,gap,off,w,col,alpha){
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy), ux = dx/len, uy = dy/len;
  let p = -(off % (dash+gap));
  gfx.lineStyle(w, C(col), (alpha ?? 1)*gAlpha);
  while (p < len){
    const s = Math.max(0, p), e = Math.min(len, p + dash);
    if (e > s){
      gfx.moveTo(x1 + ux*s, y1 + uy*s);
      gfx.lineTo(x1 + ux*e, y1 + uy*e);
    }
    p += dash + gap;
  }
  gfx.lineStyle();
}
function dashCircle(x,y,r,dash,gap,off,w,col,alpha){
  const circ = 2*Math.PI*r;
  let p = -(off % (dash+gap));
  gfx.lineStyle(w, C(col), (alpha ?? 1)*gAlpha);
  while (p < circ){
    const s = Math.max(0, p)/r, e = Math.min(circ, p + dash)/r;
    if (e > s){
      gfx.moveTo(x + Math.cos(s)*r, y + Math.sin(s)*r);
      gfx.arc(x, y, r, s, e);
    }
    p += dash + gap;
  }
  gfx.lineStyle();
}
function starPoly(cx,cy,spikes,rOut,rIn,rot){
  const pts = [];
  for (let i = 0; i < spikes*2; i++){
    const r = i % 2 === 0 ? rOut : rIn;
    const a = (rot||0) + i*Math.PI/spikes;
    pts.push(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
  }
  return pts;
}
function drawBeeG(x,y,r,wings){
  if (wings){
    const wA = 0.35 + 0.3*Math.abs(Math.sin(T*26));
    gfx.beginFill(0xCFEBFF, wA);

    gfx.drawEllipse(x + r*0.7, y - r*1.1, r*0.62, r*0.34);
    gfx.endFill();
  }
  cir(x, y, r, "#F5A623", 1, "#B97413", 1.5);
  cir(x - r*0.3, y - r*0.3, r*0.4, "#FFE985", 0.8);
  gfx.beginFill(0x2B1E0A, 0.85*gAlpha);
  gfx.drawRoundedRect(x - r*0.66, y - r*0.9, r*0.33, r*1.8, r*0.15);
  gfx.drawRoundedRect(x + r*0.05, y - r*0.9, r*0.33, r*1.8, r*0.15);
  gfx.endFill();
}

  // medaliony punktowe 10/25/50 (podświetlony pulsuje)

  }

  // otwór ula
  {

    ga(ready ? 1 : 0.35);

  }

  {

    cir(o.x, o.y, 3.5, COL.red, 1);
  });

  // kwiaty
  flowers.forEach(fl => {
    const sway = Math.sin(T*2 + fl.ph) * 3;
    for (let i = 0; i < 5; i++){
      const a = i/5 * Math.PI*2 + T*0.5 + fl.ph;
      cir(fl.x + sway + Math.cos(a)*7, fl.y + Math.sin(a)*7, 4.5, "#FF9BE8", 0.9);
    }
    cir(fl.x + sway, fl.y, 4, COL.gold, 1);
  });

  // świetliki (noc)
  fireflies.forEach(ff => {
    const fx2 = ff.x + Math.sin(T*1.1 + ff.ph)*16;
    const fy2 = ff.y + Math.sin(T*1.7 + ff.ph*2)*12;
    ga(0.4 + 0.6*Math.abs(Math.sin(T*3 + ff.ph)));
    cir(fx2, fy2, 5, "#B8FF5A", 0.4);
    cir(fx2, fy2, 3, "#D8FF9A", 1);
    ga(1);
  });

  // rollovery B-Z-Z-Z — złote gwiazdki w osi stołu
  letters.forEach(L => {
    if (L.lit) cir(L.x, L.y, 16, COL.goldHi, 0.4);
    cir(L.x, L.y, 12, L.lit ? "#FFFFFF" : COL.gold, 1, L.lit ? COL.gold : "#B98A1E", 2.5);
    poly(starPoly(L.x, L.y, 5, 8, 3.5, -Math.PI/2), L.lit ? COL.magenta : "#FFF7DC", 1);
    text(L.ch, L.x, L.y+1, 7, L.lit ? "#7A1E00" : "#7A4E00", "center", 0);
  });

  // slingshoty — pomarańczowe strzały
  [[130,528,130,585,172,598,1],[314,528,314,585,272,598,-1]].forEach((p,i) => {
    const hyp = segs.find(s => s.kick && (i===0 ? s.x1===130 : s.x1===314));
    const hot = hyp && hyp.flash > 0;
    poly([p[0],p[1], p[2],p[3], p[4],p[5]],
         hot ? "#FFB25E" : COL.orange, 1, "#FFFFFF", 2.5);
  });

  // bumpery: wielki różowy starburst + dwie turkusowe kropki
  bumpers.forEach((p,i) => {
    const f = p.flash;
    if (i === 2){
      cir(p.x, p.y, p.r + 14 + f*5, "#FF9BE8", 0.35 + f*0.3);
      cir(p.x, p.y, p.r + 6, "#FFFFFF", 1, "#F0D9EC", 1.5);
      poly(starPoly(p.x, p.y, 16, p.r + 2, p.r*0.5, T*0.4), f>0 ? "#FFFFFF" : COL.magenta, 1);
      cir(p.x, p.y, 7, "#7A1E8C", 1);
      text(String(p.score), p.x, p.y + p.r + 18, 10, "#8E1583", "center", 0);
    } else {
      cir(p.x, p.y, p.r + f*4, f>0 ? "#FFFFFF" : "#1FB9D8", 1, "#FFFFFF", 2.5);
      cir(p.x - p.r*0.3, p.y - p.r*0.35, p.r*0.35, "#FFFFFF", 0.6);
    }
  });

  // rój os
  wasps.forEach(w => {
    const wp = waspPos(w);
    ga(0.35 + 0.3*Math.abs(Math.sin(T*24 + w.ph)));
    gfx.beginFill(0xFFD7B0, gAlpha);
    gfx.drawEllipse(wp.x-6, wp.y-7, 6, 3);
    gfx.drawEllipse(wp.x+6, wp.y-7, 6, 3);
    gfx.endFill();
    ga(1);
    cir(wp.x, wp.y, 7, "#C4491B", 1, "#7A2810", 1.5);
    gfx.beginFill(0x2B1405, 0.85);
    gfx.drawRect(wp.x-4, wp.y-7, 2.5, 14);
    gfx.drawRect(wp.x+1, wp.y-7, 2.5, 14);
    gfx.endFill();
  });

  // łapa niedźwiedzia
  if (level >= 9 && bear.x > -79){
    const p = bearPaw();
    ln(p.x1, p.y, p.x2, p.y, p.r*2, "#8A5A2B");
    ln(p.x1, p.y, p.x2, p.y, p.r*2 - 10, "#5C3A18");
    for (let i = -1; i <= 1; i++){
      poly([p.x2 + 18, p.y + i*14, p.x2 + 34, p.y + i*14 - 4, p.x2 + 20, p.y + i*14 + 7], "#F2F6F7", 1);
    }
    for (let i = 0; i < 3; i++)
      rect(p.x2 - 40 + i*12, p.y - 40, 9, 5, i < bear.hp ? COL.red : "#6B5A4A", 1);
    if (bear.phase === "stay")
      text("-" + Math.round(bear.stolen), p.x2 + 10, p.y - 40, 12, COL.red, "center", 4);
  }

  // KRÓLOWA OS
  if (queen.alive){
    const qp = queenPos();
    ga(0.4 + 0.3*Math.abs(Math.sin(T*22)));
    gfx.beginFill(0xFFD7B0, gAlpha);
    gfx.drawEllipse(qp.x-14, qp.y-16, 13, 7);
    gfx.drawEllipse(qp.x+14, qp.y-16, 13, 7);
    gfx.endFill();
    ga(1);
    cir(qp.x, qp.y, 19, queen.hitCool > 0.3 ? "#FFFFFF" : "#D96A2B", 1, "#8A2810", 2);
    gfx.beginFill(0x2B1405, 0.85);
    gfx.drawRect(qp.x-13, qp.y-17, 6, 34);
    gfx.drawRect(qp.x-1, qp.y-19, 6, 38);
    gfx.drawRect(qp.x+11, qp.y-17, 6, 34);
    gfx.endFill();
    rect(qp.x-8, qp.y-8, 4, 4, COL.red, 1);
    rect(qp.x+4, qp.y-8, 4, 4, COL.red, 1);
    for (let i = 0; i < queen.max; i++)
      rect(qp.x - queen.max*5 + i*10, qp.y-34, 7, 4, i < queen.hp ? COL.gold : "#6B5A4A", 1);
  }

  // wiatrak — srebrne ramię z czerwoną piastą
  if (rotorActive()){
    const ang = rotorAng();
    const dx = Math.cos(ang)*rotor.len, dy = Math.sin(ang)*rotor.len;
    ln(rotor.x-dx, rotor.y-dy, rotor.x+dx, rotor.y+dy, rotor.r*2+3, COL.railLo);
    ln(rotor.x-dx, rotor.y-dy, rotor.x+dx, rotor.y+dy, rotor.r*2-2, COL.rail);
    cir(rotor.x-dx, rotor.y-dy, 4, "#FFFFFF", 1);
    cir(rotor.x+dx, rotor.y+dy, 4, "#FFFFFF", 1);
    cir(rotor.x, rotor.y, 7, COL.red, 1, "#FFFFFF", 2);
  }

  // drop targety — niebieskie ukośne listwy z ząbkami
  targets.forEach(tg => {
    if (tg.dead) return;
    const [tx1, ty1, tx2, ty2] = targetEnds(tg);
    ln(tx1, ty1, tx2, ty2, tg.r*2+5, "#FFFFFF");
    ln(tx1, ty1, tx2, ty2, tg.r*2, COL.blue);
    // ząbki po zewnętrznej stronie
    const nx = -Math.sin(tg.ang), ny = Math.cos(tg.ang);
    for (let k = 0; k <= 3; k++){
      const px = tx1 + (tx2-tx1)*k/3, py = ty1 + (ty2-ty1)*k/3;
      ln(px - nx*7, py - ny*7, px - nx*12, py - ny*12, 2.5, "#FFFFFF");
    }
  });

  // tunel
  if (portalActive()){
    if (!(portal.blink > 0 && Math.floor(T*11) % 2 === 0))
      dashCircle(portal.out.x, portal.out.y, portal.out.r, 7,6, -T*26, 3, COL.magenta);
    dashCircle(portal.in.x, portal.in.y, portal.in.r, 7,6, T*26, 3, COL.teal);
    cir(portal.in.x, portal.in.y, portal.in.r-4, COL.teal, 0.3 + 0.15*Math.sin(T*5));
    cir(portal.out.x, portal.out.y, portal.out.r-4, COL.magenta, 0.3 + 0.15*Math.sin(T*5));
    if (ballsList.some(b => b.warp > 0))
      dashLine(portal.in.x, portal.in.y, portal.out.x, portal.out.y, 4,9, T*160, 2.5, COL.teal);
  }

  // wir magnetyczny
  if (vortexActive()){
    ga(0.6);
    for (let i = 0; i < 3; i++)
      arc(vortex.x, vortex.y, 16 + i*13, T*1.6 + i*2.1, T*1.6 + i*2.1 + 3.6, 2.5, COL.teal);
    ga(1);
  }

  // lasery
  for (let i = 0; i < laserCount(); i++){
    const lx = laserX(i), ly = LASERS[i].y;
    ln(lx-LASER_HALF, ly, lx+LASER_HALF, ly, 8, COL.red, 0.35);
    ln(lx-LASER_HALF, ly, lx+LASER_HALF, ly, 4, COL.red);
    ln(lx-LASER_HALF, ly, lx+LASER_HALF, ly, 1.5, "#FFD7D7");
    cir(lx-LASER_HALF, ly, 4, COL.red, 1);
    cir(lx+LASER_HALF, ly, 4, COL.red, 1);
  }

  // kałuża miodu
  if (honey.t > 0){
    ga(Math.min(1, honey.t / 1.5));
    const pts = [];
    for (let i = 0; i < 14; i++){
      const a = i/14 * Math.PI*2;
      const r = honey.r * (0.86 + 0.14*Math.sin(T*2.2 + i*2.4));
      pts.push(honey.x + Math.cos(a)*r, honey.y + Math.sin(a)*r*0.85);
    }
    poly(pts, "#E08A00", 0.5, "#B96F00", 2.5);
    text("≈", honey.x, honey.y, 18, "#7A4E00", "center", 0);
    ga(1);
  }

  // bonusy i klątwy
  pickups.forEach(p => {
    const bob = Math.sin(T*3 + p.x) * 4;
    const dying = p.life - p.t < 2;
    if (dying && Math.floor(p.t*6) % 2 === 0) return;
    const y = p.y + bob;
    if (p.bad){
      poly(starPoly(p.x, y, 8, 16, 8, -T*1.2), "#4A0610", 0.9, p.type.c, 2.5);
      text(p.type.sym, p.x, y+1, 11, p.type.c, "center", 4);
    } else {
      const pts = [];
      for (let i = 0; i < 6; i++){
        const a = Math.PI/6 + i*Math.PI/3 + T*0.8;
        pts.push(p.x + Math.cos(a)*14, y + Math.sin(a)*14);
      }
      poly(pts, "#173B4A", 0.9, p.type.c, 2.5);
      text(p.type.k === "1UP" ? "1UP" : p.type.k[0], p.x, y+1, 11, p.type.c, "center", 4);
    }
  });

  // tarcza nad rynną
  if (effects.shield > 0){
    ga(effects.shield < 2 ? (Math.floor(T*6)%2 ? 0.3 : 0.9) : 0.9);
    glowLn(150,690,294,690, 5, "#37E0DE", 10);
    ga(1);
  }

  // błysk Magna-Save
  if (magna.t > 0){
    ga(magna.t / 0.5);
    arc(222, 720, 90, Math.PI, 2*Math.PI, 4, "#37E0DE");
    ga(1);
  }

  // słupek toru
  posts.forEach(p => cir(p.x, p.y, p.r, COL.rail, 1, COL.railLo, 1.5));

  // flippery — czarne z chromowaną śrubą
  flippers.forEach(f => {
    const tip = flipTip(f);
    ln(f.px, f.py, tip.x, tip.y, f.r*2 + 4, "#FFFFFF");
    ln(f.px, f.py, tip.x, tip.y, f.r*2, COL.black);
    ln(f.px, f.py, tip.x, tip.y, f.r*0.8, "#3A3A46");
    cir(f.px, f.py, 4.5, COL.rail, 1, COL.railLo, 1);
  });

  // wyrzutnia — metalowa sprężyna
  {
    const compress = plunger.charging ? plunger.power : 0;
    const springTop = 654 + compress*34;
    for (let y = springTop; y < 712; y += 6){
      ln(428, y, 456, y+3, 2.5, COL.railLo);
      ln(428, y, 456, y+3, 1, COL.railHi);
    }
    if (plunger.charging){
      rect(465, 700 - SS_MAX*380, 8, (SS_MAX-SS_MIN)*380, "#37E0DE", 0.5);
      rect(466, 700 - compress*380, 6, compress*380, COL.gold, 1);
    }
  }

  // kulki — chromowane sprite'y + smuga
  let bi = 0;
  if (state === "play"){
    ballsList.forEach(b => {
      if (b.warp > 0) return;
      b.trail.push({x:b.x, y:b.y});
      if (b.trail.length > 9) b.trail.shift();
      b.trail.forEach((p,i) => cir(p.x, p.y, b.r*(i/b.trail.length)*0.8, "#FFFFFF", 0.06*i));
      const s = ballSprite(bi++);
      s.position.set(b.x, b.y);
      s.width = s.height = b.r*2;
    });
  }
  for (let i = bi; i < ballSprites.length; i++) ballSprites[i].visible = false;

  // PAJĄK
  if (spider.phase !== "idle"){
    const jitter = spider.phase === "hold" ? Math.sin(T*40)*2 : 0;
    const sx = spider.x + jitter, sy = spider.y;
    ln(spider.x, -10, spider.x, sy, 1.5, "#5C5C6E", 0.7);
    for (let i = 0; i < 3; i++){
      const ly = sy + 2 + i*4, lx = 10 + i*4;
      ln(sx-4, sy, sx-lx, ly+6, 2, "#33334A");
      ln(sx+4, sy, sx+lx, ly+6, 2, "#33334A");
    }
    cir(sx, sy, 11, "#241D3D", 1, "#4A4A66", 2);
    rect(sx-5, sy-3, 3, 3, COL.red, 1);
    rect(sx+2, sy-3, 3, 3, COL.red, 1);
  }

  // iskry
  sparks.forEach(s => {
    gfx.beginFill(C(s.c.startsWith("#") ? s.c : "#FFFFFF"), Math.max(0, s.life/0.55));
    gfx.drawRect(s.x-1.5, s.y-1.5, 3, 3);
    gfx.endFill();
  });

  // zaćmienie
  if (debuffs.fog > 0){
    gfx.beginFill(0x04020A, 0.88 * Math.min(1, debuffs.fog / 1.2));
    gfx.drawRect(0,0,W,H);
    gfx.beginHole();
    ballsList.forEach(b => { if (b.warp <= 0) gfx.drawCircle(b.x, b.y, 78); });
    gfx.drawCircle(222, 655, 115);
    gfx.endHole();
    gfx.endFill();
  }

  // nakładka pory dnia
  themeOv.clear();
  const ti = themeIdx();
  const tint = [ [0xFF3EA5, 0.05], [0x000000, 0], [0xFF6A00, 0.08], [0x101A66, 0.24] ][ti];
  if (tint[1] > 0){
    themeOv.beginFill(tint[0], tint[1]);
    themeOv.drawRect(0,0,W,H);
    themeOv.endFill();
  }

  drawHud();
  drawMsgs();
  drawOverlays();
}

function drawMsgs(){
  for (let i = msgs.length-1; i >= 0; i--){
    const m = msgs[i];
    m.t += 1/60;
    if (m.t > m.dur){ msgs.splice(i,1); continue; }
    if (!m.text) continue;
    ga(Math.min(1, (m.dur - m.t) / 0.4, m.t / 0.15));
    if (m.big){
      text(m.text, 240, 330 + i*26, 24 + Math.sin(m.t*10)*2, "#C41616", "center", 6);
    } else {
      text(m.text, 240, 430 + i*24, 15, "#7A1E00", "center", 0);
    }
    ga(1);
  }
  popups.forEach(p => {
    ga(Math.max(0, 1 - p.t/0.9));
    text(p.txt, p.x, p.y - p.t*46, 13, "#4A2410", "center", 0);
    ga(1);
  });
  if (flash > 0){
    gfx.beginFill(0xFFFFFF, flash*0.5);
    gfx.drawRect(0,0,W,H);
    gfx.endFill();
  }
}

/* ---------- klatka ---------- */
function drawFrame(){
  gfx.clear();
  if (shake > 0.2){
    app.stage.position.set((Math.random()-.5)*shake, (Math.random()-.5)*shake);
    shake *= 0.86;
  } else app.stage.position.set(0,0);
  if (state === "video"){ ballSprites.forEach(s => s.visible = false); themeOv.clear(); drawVideo(); }
  else if (state === "video2"){ ballSprites.forEach(s => s.visible = false); themeOv.clear(); drawInvaders(); }
  else if (state === "hive"){ ballSprites.forEach(s => s.visible = false); themeOv.clear(); drawHive(); }
  else drawTable();
  endTexts();
}

/* ---------- pętla (ticker PIXI) ---------- */
app.ticker.add(() => {
  const dt = Math.min(0.033, app.ticker.deltaMS / 1000);
  const SUB = 4, h = dt/SUB;
  for (let i = 0; i < SUB; i++) step(h);
  drawFrame();
});


/* ---------- sterowanie ---------- */
const L_KEYS = ["ArrowLeft","KeyA","KeyZ"], R_KEYS = ["ArrowRight","KeyD","Slash"];
function pressFlip(side, down){
  fin[side] += down ? 1 : -1;
  if (fin[side] < 0) fin[side] = 0;
  if (down){ spiderMash(); beep(90,.05,"triangle",.05); }
}
function toggleMusic(){
  music.on = !music.on;
  say(music.on ? "MUZYKA ON" : "MUZYKA OFF", 1);
}
function startIfIdle(){
  if (state === "title" || state === "over"){ newGame(); return true; }
  return false;
}
function say2Title(){ beep(600, .07, "square", .04); }
window.addEventListener("keydown", e => {
  audioOn();
  if (["ArrowLeft","ArrowRight","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === "KeyM"){ toggleMusic(); return; }
  if (state === "initials"){
    if (e.code === "ArrowLeft" || L_KEYS.includes(e.code))
      entry.name[entry.slot] = (entry.name[entry.slot] + 25) % 26;
    else if (e.code === "ArrowRight" || R_KEYS.includes(e.code))
      entry.name[entry.slot] = (entry.name[entry.slot] + 1) % 26;
    else if (e.code === "Space" || e.code === "Enter"){
      entry.slot++;
      if (entry.slot >= 3) saveInitials();
    }
    beep(500 + entry.slot*100, .05, "square", .04);
    return;
  }
  if (state === "title"){
    if (e.code === "Digit2"){ twoP = !twoP; say2Title(); return; }
    if (e.code === "KeyT"){ daily = !daily; say2Title(); return; }
  }
  if (state === "over" && e.code === "KeyN" && unlockedNG){ newGame({ng:true}); return; }
  if (state === "video"){
    if (["Space","Enter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyA","KeyD","KeyZ","Slash"].includes(e.code)) vmFlap();
    return;
  }
  if (state === "video2"){
    if (L_KEYS.includes(e.code)) pressFlip("L", true);
    if (R_KEYS.includes(e.code)) pressFlip("R", true);
    if (e.code === "Space" || e.code === "ArrowUp") viShoot();
    return;
  }
  if (state === "hive"){
    if (L_KEYS.includes(e.code)) hiveNudge(-1);
    if (R_KEYS.includes(e.code)) hiveNudge(1);
    return;
  }
  if ((e.code === "Space" || e.code === "Enter") && startIfIdle()) return;
  if (L_KEYS.includes(e.code)) pressFlip("L", true);
  if (R_KEYS.includes(e.code)) pressFlip("R", true);
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") doTilt();
  if (e.code === "KeyS"){ magnaSave(); return; }
  if (e.code === "Space") plunger.charging = true;
  if (e.code === "ArrowDown"){
    if (ballOnPlunger()) plunger.charging = true;
    else magnaSave();
  }
});
window.addEventListener("keyup", e => {
  if (L_KEYS.includes(e.code)) pressFlip("L", false);
  if (R_KEYS.includes(e.code)) pressFlip("R", false);
  if (e.code === "Space" || e.code === "ArrowDown") releasePlunger();
});
window.addEventListener("blur", () => {
  fin.L = 0; fin.R = 0;
  plunger.charging = false; plunger.power = 0;
});

// dotyk: strefa "♪" wycisza; kulka na wyrzutni — dotyk ładuje; inaczej połówki = flippery
const touchMap = {};
cv.addEventListener("touchstart", e => {
  e.preventDefault(); audioOn();
  const rect = cv.getBoundingClientRect();
  for (const t of e.changedTouches){
    const gx = (t.clientX - rect.left) / rect.width * W;
    const gy = (t.clientY - rect.top) / rect.height * H;
    if (gy < 85 && gx > 380){ toggleMusic(); continue; }
    if (state === "initials"){
      if (gy > 560){ entry.slot++; if (entry.slot >= 3) saveInitials(); }
      else if (gx < W/2) entry.name[entry.slot] = (entry.name[entry.slot] + 25) % 26;
      else entry.name[entry.slot] = (entry.name[entry.slot] + 1) % 26;
      continue;
    }
    if (state === "video"){ vmFlap(); continue; }
    if (state === "hive"){ hiveNudge(gx < W/2 ? -1 : 1); continue; }
    if (state === "title" && gy < 120 && gx < 160){ twoP = !twoP; say2Title(); continue; }
    if (state === "title" && gy < 120 && gx >= 160 && gx <= 380){ daily = !daily; say2Title(); continue; }
    if (state === "over" && gy > 640 && unlockedNG){ newGame({ng:true}); continue; }
    if (startIfIdle()) continue;
    if (gy > 640 && gx > 160 && gx < 320){ magnaSave(); continue; }
    if (ballOnPlunger()){
      touchMap[t.identifier] = "P"; plunger.charging = true;
    } else {
      const side = gx < W/2 ? "L" : "R";
      touchMap[t.identifier] = side;
      pressFlip(side, true);
    }
  }
}, {passive:false});
function touchEnd(e){
  e.preventDefault();
  for (const t of e.changedTouches){
    const role = touchMap[t.identifier];
    delete touchMap[t.identifier];
    if (role === "L" || role === "R") pressFlip(role, false);
    else if (role === "P") releasePlunger();
  }
}
cv.addEventListener("touchend", touchEnd, {passive:false});
cv.addEventListener("touchcancel", touchEnd, {passive:false});
})();
